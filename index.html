<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bulk Asset Inspections</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
<link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css" />
<style>
html, body, #viewDiv {
  padding: 0; margin:0; height:100%; width:100%;
}
#viewDiv { position: relative; }

#sidePanel {
  position: fixed; top:0; right:-100%; width:340px; height:100%;
  background:white; box-shadow:0 0 10px rgba(0,0,0,0.3);
  transition:right 0.3s; display:flex; flex-direction:column; padding:10px;
}

#infoDiv { flex-grow:1; overflow-y:auto; margin-top:10px; }

#infoTable { width:100%; border-collapse: collapse; }
#infoTable th, #infoTable td { padding:8px; border:1px solid #ddd; text-align:left; }
#infoTable th { background-color:#f2f2f2; }

button { background:#007BFF; color:white; border:none; cursor:pointer; padding:8px; margin-bottom:6px; }
button:hover { background:#0056b3; }

select, input[type="date"] { width:100%; padding:5px; margin-bottom:6px; }

#successMessage {
  background-color: #4CAF50; color:white; padding:10px; text-align:center;
  position: fixed; top:0; left:50%; transform:translateX(-50%); z-index:1000; display:none;
}

#drawBtn, #clearBtn { position:absolute; top:10px; left:10px; z-index:10; width:auto; margin-right:5px; }
</style>
</head>
<body>
<div id="viewDiv"></div>

<button id="drawBtn">Draw Selection</button>
<button id="clearBtn">Clear Selection</button>

<div id="sidePanel">
  <h2>Bulk Inspection</h2>
  <form id="inspectionForm">
    <label for="inspectionDate">Inspection Date:</label>
    <input type="date" id="inspectionDate" required>

    <label for="conditionScore">Condition Score:</label>
    <select id="conditionScore" required>
      <option value="">Select</option>
      <option value="1">1 - Very Poor</option>
      <option value="2">2 - Poor</option>
      <option value="3">3 - Ok</option>
      <option value="4">4 - Good</option>
      <option value="5">5 - Very Good</option>
    </select>

    <label for="requiresMaintenance">Requires Maintenance:</label>
    <select id="requiresMaintenance" required>
      <option value="">Select</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <div style="margin-top:10px;">
      <button type="submit">Add Inspections</button>
    </div>
  </form>

  <div id="infoDiv">
    <h2>Previous Inspections (first selected feature)</h2>
    <table id="infoTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Score</th>
          <th>Maintenance</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="successMessage">New inspections added successfully!</div>

<script src="https://js.arcgis.com/4.28/"></script>
<script>
require([
  "esri/Map",
  "esri/views/MapView",
  "esri/layers/FeatureLayer",
  "esri/Graphic",
  "esri/widgets/Sketch/SketchViewModel",
  "esri/geometry/geometryEngine"
], function(Map, MapView, FeatureLayer, Graphic, SketchViewModel, geometryEngine) {

  const map = new Map({
    basemap: "topo-vector"
  });

  const view = new MapView({
    container: "viewDiv",
    map: map,
    center: [175.5,-36.8], // adjust
    zoom: 11
  });

  // --- Layers ---
  const featureLayer = new FeatureLayer({
    url: "https://services3.arcgis.com/HYKqs4HgCmzergJk/arcgis/rest/services/TMT_VIEW_AoteaCombinedCatTrapData_/FeatureServer/0"
  });

  const inspectionLayer = new FeatureLayer({
    url: "https://services3.arcgis.com/HYKqs4HgCmzergJk/arcgis/rest/services/TMT_VIEW_AoteaCombinedCatTrapData_/FeatureServer/1"
  });

  map.add(featureLayer);
  map.add(inspectionLayer);

  // --- Selection setup ---
  let selectedFeatures = [];
  let sketch = new SketchViewModel({
    view: view,
    layer: view.graphics
  });

  document.getElementById("drawBtn").onclick = () => {
    view.graphics.removeAll();
    sketch.create("polygon"); // you can change to "rectangle"
  };

  document.getElementById("clearBtn").onclick = () => {
    view.graphics.removeAll();
    selectedFeatures = [];
    hidePanel();
  };

  sketch.on("create", evt => {
    if(evt.state === "complete") {
      const geometry = evt.graphic.geometry;
      const query = featureLayer.createQuery();
      query.geometry = geometry;
      query.spatialRelationship = "intersects";
      query.returnGeometry = true;
      query.outFields = ["GlobalID"];

      featureLayer.queryFeatures(query).then(res => {
        if(res.features.length) {
          selectedFeatures = res.features;
          view.graphics.removeAll();
          selectedFeatures.forEach(f => {
            view.graphics.add(new Graphic({
              geometry: f.geometry,
              symbol: { type:"simple-marker", color:"red", size:8 }
            }));
          });

          // Show side panel with first feature
          showPanel();
          fetchInspections(selectedFeatures[0].attributes.GlobalID);
        } else {
          selectedFeatures = [];
          hidePanel();
          alert("No features selected in drawn area");
        }
      });
    }
  });

  function showPanel() { document.getElementById("sidePanel").style.right = "0"; }
  function hidePanel() { document.getElementById("sidePanel").style.right = "-100%"; }

  // --- Inspections ---
  function fetchInspections(globalID) {
    const q = featureLayer.createQuery();
    q.where = "relfeatureglobalid='" + globalID + "'";
    q.returnGeometry = false;
    q.outFields = ["inspection_date","condition_score","requires_maintenance"];

    inspectionLayer.queryFeatures(q).then(res => {
      const tbody = document.querySelector("#infoTable tbody");
      tbody.innerHTML = "";
      if(res.features.length) {
        res.features.sort((a,b)=> new Date(b.attributes.inspection_date)-new Date(a.attributes.inspection_date));
        res.features.forEach(f => {
          const row = `<tr>
            <td>${formatDate(f.attributes.inspection_date)}</td>
            <td>${f.attributes.condition_score}</td>
            <td>${f.attributes.requires_maintenance}</td>
          </tr>`;
          tbody.innerHTML += row;
        });
      } else {
        tbody.innerHTML = "<tr><td colspan='3'>No inspections</td></tr>";
      }
    });
  }

  function formatDate(dateStr) {
    if(!dateStr) return "";
    return new Date(dateStr).toLocaleDateString();
  }

  // --- Add inspection to all selected ---
  document.getElementById("inspectionForm").addEventListener("submit", e => {
    e.preventDefault();
    if(!selectedFeatures.length) { alert("No features selected"); return; }

    const date = document.getElementById("inspectionDate").value;
    const score = document.getElementById("conditionScore").value;
    const req = document.getElementById("requiresMaintenance").value;

    const edits = selectedFeatures.map(f => ({
      attributes: {
        inspection_date: date,
        condition_score: score,
        requires_maintenance: req,
        relfeatureglobalid: f.attributes.GlobalID
      }
    }));

    inspectionLayer.applyEdits({ addFeatures: edits }).then(res => {
      showSuccess();
      fetchInspections(selectedFeatures[0].attributes.GlobalID);
      document.getElementById("inspectionForm").reset();
    }).catch(err => { console.error(err); alert("Failed to add inspections"); });
  });

  function showSuccess() {
    const msg = document.getElementById("successMessage");
    msg.style.display = "block";
    setTimeout(()=>{ msg.style.display="none"; },3000);
  }
});
</script>
</body>
</html>
