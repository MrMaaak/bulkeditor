<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi Select Trap Records</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<script src="https://js.arcgis.com/4.30/"></script>

<style>
/* TMT theme: warm charcoal panels, cream text, tan accent (matches the TMT Dashboard experience). */
:root{
  --panel:rgba(20,17,13,0.94);
  --panel-line:rgba(241,230,208,0.14);
  --field:#221e19;
  --field-line:#3d362e;
  --cream:#f1e6d0;
  --muted:#a8998a;
  --tan:#c7b497;
  --tan-hover:#d8c8ad;
  --ink:#12100d;
  --orange:#e08a3c;
}

html, body, #viewDiv { height:100%; margin:0; padding:0; font-family:"Inter","Segoe UI",Tahoma,Geneva,Verdana,sans-serif; }

#sidePanel{
  position:absolute;
  top:16px;
  right:16px;
  max-height:calc(100% - 32px);
  width:340px;
  box-sizing:border-box;
  background:var(--panel);
  color:var(--cream);
  border:1px solid var(--panel-line);
  border-radius:10px;
  box-shadow:0 12px 32px rgba(0,0,0,0.45);
  padding:22px 22px 20px;
  overflow-y:auto;
  display:none;
  z-index:10;
  backdrop-filter:blur(6px);
  scrollbar-width:thin;
  scrollbar-color:var(--field-line) transparent;
}

#sidePanel h3{
  margin:0;
  font-size:18px;
  font-weight:700;
  letter-spacing:0.01em;
}

#panelSubtitle{
  margin:4px 0 0;
  font-size:13px;
  color:var(--muted);
}

#message{
  display:none;
  margin-top:14px;
  padding:9px 12px;
  border-radius:6px;
  font-size:13px;
  border:1px solid transparent;
}

#count{
  display:inline-block;
  margin:16px 0 4px;
  padding:5px 12px;
  border-radius:999px;
  background:rgba(199,180,151,0.16);
  border:1px solid rgba(199,180,151,0.4);
  color:var(--tan);
  font-size:13px;
  font-weight:600;
}

#relatedForm label{
  display:block;
  margin-top:18px;
  margin-bottom:6px;
  font-size:11px;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--muted);
}

#relatedForm label .required{ color:var(--tan); margin-left:2px; }

#relatedForm input, #relatedForm select{
  width:100%;
  padding:10px 12px;
  background:var(--field);
  color:var(--cream);
  border:1px solid var(--field-line);
  border-radius:6px;
  font-size:14px;
  font-family:inherit;
  box-sizing:border-box;
  color-scheme:dark;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}

#relatedForm input:focus, #relatedForm select:focus{
  border-color:var(--tan);
  box-shadow:0 0 0 3px rgba(199,180,151,0.2);
}

#submitBtn{
  margin-top:24px;
  width:100%;
  padding:12px;
  background:var(--tan);
  color:var(--ink);
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
  font-family:inherit;
  transition:background .15s;
}

#submitBtn:hover{ background:var(--tan-hover); }

#submitBtn:disabled{
  background:#3a342d;
  color:var(--muted);
  cursor:not-allowed;
}

#toolbar{
  display:flex;
  flex-direction:column;
  gap:8px;
  width:170px;
  padding:10px;
  background:var(--panel);
  border:1px solid var(--panel-line);
  border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
}

.mapButton{
  width:100%;
  padding:9px 12px;
  background:var(--tan);
  color:var(--ink);
  border:1px solid var(--tan);
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  font-family:inherit;
  transition:background .15s, color .15s;
}

.mapButton:hover{ background:var(--tan-hover); }

.mapButton.secondary{ background:transparent; color:var(--cream); border-color:var(--field-line); }
.mapButton.secondary:hover{ background:rgba(241,230,208,0.08); }

.mapButton.active{ background:var(--orange); border-color:var(--orange); color:var(--ink); }
.mapButton.active:hover{ background:#eb9b52; }

#toolbarHint{
  display:none;
  font-size:12px;
  line-height:1.4;
  color:var(--muted);
}

#signInOverlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
  background:var(--ink);
  color:var(--cream);
  z-index:20;
  text-align:center;
  padding:20px;
}

#signInBtn{
  padding:11px 22px;
  background:var(--tan);
  color:var(--ink);
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
  font-family:inherit;
}

#signInBtn:hover{ background:var(--tan-hover); }
</style>
</head>

<body>
<div id="viewDiv"></div>

<div id="signInOverlay">
  <div id="signInText">Connect to your ArcGIS account to continue.</div>
  <button id="signInBtn">Continue with ArcGIS</button>
</div>

<div id="sidePanel">
  <h3>Add cat trapping records</h3>
  <p id="panelSubtitle">One record is added to every selected trap.</p>
  <div id="message"></div>
  <div id="count">0 traps selected</div>

  <form id="relatedForm"></form>

  <button id="submitBtn" disabled>Add records</button>
</div>

<script>
require([
  "esri/WebMap",
  "esri/views/MapView",
  "esri/widgets/Sketch/SketchViewModel",
  "esri/layers/GraphicsLayer",
  "esri/identity/OAuthInfo",
  "esri/identity/IdentityManager"
], function(WebMap, MapView, SketchViewModel, GraphicsLayer, OAuthInfo, esriId){
// The ArcGIS loader skips async callbacks, so the async work lives in this wrapper.
(async () => {

  // OAuth app registered in ArcGIS Online (Content > New item > Developer credentials > OAuth credentials).
  // Its redirect URLs must include this page's oauth-callback.html.
  const APP_ID = "iZVrlrTESdLg7Oyj";
  const PORTAL_URL = "https://www.arcgis.com";

  if(APP_ID !== "YOUR_APP_ID"){
    esriId.registerOAuthInfos([
      new OAuthInfo({ appId: APP_ID, portalUrl: PORTAL_URL, popup: true })
    ]);
  }

  // Reuse the ArcGIS session the user already has (e.g. from Experience Builder).
  // Only if no session is found do we show a one-click button; the popup it opens
  // closes itself straight away when the user is already signed in to ArcGIS Online.
  async function signIn(){
    const sharingUrl = PORTAL_URL + "/sharing";

    try {
      return await esriId.checkSignInStatus(sharingUrl);
    } catch {
      const overlay = document.getElementById("signInOverlay");
      const text = document.getElementById("signInText");
      overlay.style.display = "flex";

      return new Promise(resolve => {
        document.getElementById("signInBtn").onclick = async () => {
          try {
            const credential = await esriId.getCredential(sharingUrl);
            overlay.style.display = "none";
            resolve(credential);
          } catch(err) {
            text.innerText = "Sign in failed or was cancelled. Please try again.";
          }
        };
      });
    }
  }

  let formConfig = null;

  // Fetch the form config while the sign-in check runs, rather than after the map loads.
  const formConfigReady = loadFormConfig();

  // Until a real App ID is filled in, fall back to the standard ArcGIS sign-in prompt.
  if(APP_ID !== "YOUR_APP_ID") await signIn();

  async function loadFormConfig() {
    const response = await fetch("./formConfig.json");
    if (!response.ok) {
      throw new Error("Failed to load formConfig.json");
    }
    formConfig = await response.json();
    buildForm(formConfig.fields);
  }

  function buildForm(fields){
    const form=document.getElementById("relatedForm");
    form.innerHTML="";

    fields.forEach(field=>{
      const label=document.createElement("label");
      label.innerText=field.label;
      label.htmlFor=field.id;
      if(field.required){
        const star=document.createElement("span");
        star.className="required";
        star.innerText="*";
        label.appendChild(star);
      }
      form.appendChild(label);

      let input;
      if(field.type==="select"){
        input=document.createElement("select");

        const defaultOption=document.createElement("option");
        defaultOption.value="";
        defaultOption.innerText="Choose…";
        input.appendChild(defaultOption);

        field.domain.forEach(opt=>{
          const o=document.createElement("option");
          o.value=opt.value;
          o.innerText=opt.label;
          input.appendChild(o);
        });
      } else {
        input=document.createElement("input");
        input.type=field.type;
      }

      input.id=field.id;
      form.appendChild(input);
    });
  }

  const webmap = new WebMap({
    portalItem: { id: "552cdf8d85234994a53339f6fbacfa3b" }
  });

  const view = new MapView({
    container: "viewDiv",
    map: webmap
  });

  let trapsLayer, relatedTable, layerView;
  const selected = new Map(); // objectId -> GlobalID
  let highlightHandle = null;

  const sidePanel = document.getElementById("sidePanel");
  const countDiv = document.getElementById("count");
  const submitBtn = document.getElementById("submitBtn");
  const messageDiv = document.getElementById("message");

  function updateCount(){
    countDiv.innerText = selected.size + (selected.size === 1 ? " trap selected" : " traps selected");
    submitBtn.disabled = selected.size === 0;
  }

  function refreshSelection(){
    if(highlightHandle) highlightHandle.remove();
    highlightHandle = selected.size && layerView ? layerView.highlight([...selected.keys()]) : null;
    updateCount();
    if(selected.size) sidePanel.style.display = "block";
  }

  function showMessage(message,type="info",duration=2000){
    messageDiv.innerText=message;
    messageDiv.style.display="block";

    messageDiv.style.background =
      type==="success" ? "rgba(143,174,126,0.16)" :
      type==="error" ? "rgba(224,138,60,0.16)" : "rgba(199,180,151,0.14)";

    messageDiv.style.color =
      type==="success" ? "#b9d3aa" :
      type==="error" ? "#f0b27a" : "#f1e6d0";

    messageDiv.style.borderColor =
      type==="success" ? "rgba(143,174,126,0.5)" :
      type==="error" ? "rgba(224,138,60,0.5)" : "rgba(199,180,151,0.4)";

    setTimeout(()=>{ messageDiv.style.display="none"; }, duration);
  }

  view.when(async () => {

    await formConfigReady;

    trapsLayer = webmap.layers.find(l => l.type === "feature" && l.title === "Cat Traps");
    relatedTable = webmap.tables.find(t => t.title === "Cat Trapping Data");

    if(!trapsLayer){
      alert("Traps layer not found. Check layer title.");
      return;
    }

    if(!relatedTable){
      alert("Related table not found. Check table title.");
      return;
    }

    trapsLayer.popupEnabled = false;
    view.popup.autoOpenEnabled = false;

    layerView = await view.whenLayerView(trapsLayer);

    // Field names are only known once the layer has loaded.
    const oidField = trapsLayer.objectIdField;
    const gidField = trapsLayer.globalIdField || "GlobalID";

    // Looks up GlobalIDs for new traps in one request (per 500), instead of one request per trap.
    async function addToSelection(objectIds){
      const ids = objectIds.filter(id => !selected.has(id));
      const batches = [];
      for(let i = 0; i < ids.length; i += 500) batches.push(ids.slice(i, i + 500));

      const results = await Promise.all(batches.map(batch =>
        trapsLayer.queryFeatures({ objectIds: batch, outFields:[oidField, gidField], returnGeometry:false })
      ));

      for(const { features } of results){
        for(const f of features){
          const globalId = f.attributes[gidField];
          if(globalId) selected.set(f.attributes[oidField], globalId);
        }
      }

      refreshSelection();
    }

    const lassoLayer = new GraphicsLayer({ listMode:"hide" });
    view.map.add(lassoLayer);

    const lassoSymbol = {
      type:"simple-fill",
      color:[0,121,193,0.12],
      outline:{ color:[0,121,193], width:2, style:"dash" }
    };

    // Freehand mode: press and drag around the traps, release to select.
    const sketchVM = new SketchViewModel({
      view: view,
      layer: lassoLayer,
      defaultCreateOptions:{ mode:"freehand" },
      polygonSymbol: lassoSymbol,
      activeFillSymbol: lassoSymbol
    });

    const toolbar = document.createElement("div");
    toolbar.id = "toolbar";

    const lassoBtn = document.createElement("button");
    lassoBtn.innerText="Lasso select";
    lassoBtn.className="mapButton";

    const clearBtn = document.createElement("button");
    clearBtn.innerText="Clear selection";
    clearBtn.className="mapButton secondary";

    const hint = document.createElement("div");
    hint.id = "toolbarHint";
    hint.innerText = "Drag around traps to select. Esc to cancel.";

    toolbar.append(lassoBtn, clearBtn, hint);
    view.ui.add(toolbar,"top-left");

    const lassoHint = hint.innerText;
    let hintTimer = null;
    let lassoFinishedAt = 0;

    function setLassoActive(active){
      clearTimeout(hintTimer);
      lassoBtn.classList.toggle("active", active);
      lassoBtn.innerText = active ? "Cancel lasso" : "Lasso select";
      hint.innerText = lassoHint;
      hint.style.display = active ? "block" : "none";
      view.container.style.cursor = active ? "crosshair" : "";
    }

    function flashHint(text){
      clearTimeout(hintTimer);
      hint.innerText = text;
      hint.style.display = "block";
      hintTimer = setTimeout(() => { hint.style.display = "none"; }, 3000);
    }

    lassoBtn.onclick = () => {
      if(sketchVM.state === "active"){
        sketchVM.cancel();
        return;
      }
      sketchVM.create("polygon");
      setLassoActive(true);
    };

    clearBtn.onclick = () => {
      if(sketchVM.state === "active") sketchVM.cancel();
      selected.clear();
      refreshSelection();
      document.getElementById("relatedForm").reset();
      sidePanel.style.display="none";
    };

    sketchVM.on("create", async event=>{
      if(event.state === "cancel"){
        setLassoActive(false);
        lassoLayer.removeAll();
        return;
      }
      if(event.state!=="complete") return;

      setLassoActive(false);
      lassoFinishedAt = Date.now();
      const geometry = event.graphic.geometry;
      lassoLayer.removeAll();

      try{
        const objectIds = await layerView.queryObjectIds({ geometry, spatialRelationship:"intersects" });
        if(!objectIds.length){
          flashHint("No traps inside the lasso.");
          return;
        }
        await addToSelection(objectIds);
      } catch(err){
        console.error("Lasso selection failed", err);
        flashHint("Lasso selection failed: " + err.message);
      }
    });

    // Click a trap to add it; click a selected trap again to remove it.
    view.on("click", async event=>{
      // Ignore the click that can fire as the lasso drag is released.
      if(sketchVM.state === "active" || Date.now() - lassoFinishedAt < 400) return;

      const hit=await view.hitTest(event,{ include:[trapsLayer] });
      const graphic=hit.results[0]?.graphic;
      if(!graphic) return;

      const objectId=graphic.attributes[oidField];

      try{
        if(selected.has(objectId)){
          selected.delete(objectId);
          refreshSelection();
        } else {
          await addToSelection([objectId]);
        }
      } catch(err){
        console.error("Selection failed", err);
        flashHint("Selection failed: " + err.message);
      }
    });

  });

  submitBtn.onclick=async ()=>{
    if(!selected.size){
      showMessage("Select at least one trap","error");
      return;
    }

    submitBtn.disabled=true;

    const attributes={};

    for(const field of formConfig.fields){
      const value=document.getElementById(field.id).value;

      if(field.required && !value){
        showMessage("Complete required fields","error");
        submitBtn.disabled=false;
        return;
      }

      // Date inputs have no time zone and ArcGIS would read them as UTC,
      // so convert using the browser's local (NZ) time.
      if(value && (field.type==="datetime-local" || field.type==="date")){
        attributes[field.id]=new Date(field.type==="date" ? value+"T00:00" : value).getTime();
      } else {
        attributes[field.id]=value;
      }
    }

    const addFeatures=[...selected.values()].map(guid=>({
      attributes:{ GUID:guid, ...attributes }
    }));

    try{
      const result=await relatedTable.applyEdits({ addFeatures });
      const failed=result.addFeatureResults.filter(r=>r.error!=null);

      if(failed.length===0){
        showMessage("Added "+addFeatures.length+" records","success");

        selected.clear();
        refreshSelection();
        document.getElementById("relatedForm").reset();
      } else {
        showMessage("Some records failed","error");
        submitBtn.disabled=false;
      }

    } catch(err){
      showMessage("Error adding records: "+err.message,"error");
      submitBtn.disabled=false;
    }
  };

})();
});
</script>

</body>
</html>
