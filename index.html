<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi Select Trap Records</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.30/"></script>

<style>
html, body, #viewDiv { height:100%; margin:0; padding:0; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }

#sidePanel{
  position:absolute;
  top:0;
  right:0;
  width:360px;
  height:100%;
  background:#fff;
  box-shadow:-4px 0 12px rgba(0,0,0,0.2);
  padding:20px;
  overflow-y:auto;
  display:none;
  z-index:10;
  border-left:1px solid #ddd;
}

#message{ 
  display:none;
  margin-bottom:10px;
  padding:8px 10px;
  border-radius:4px;
  font-size:14px;
}

#count{
  margin:15px 0;
  font-weight:600;
  color:#0079c1;
}

#relatedForm label{
  display:block;
  margin-top:15px;
  margin-bottom:5px;
  font-weight:600;
}

#relatedForm input, #relatedForm select{
  width:100%;
  padding:8px 10px;
  border:1px solid #ccc;
  border-radius:4px;
  font-size:14px;
  box-sizing:border-box;
}

#submitBtn{
  margin-top:20px;
  width:100%;
  padding:12px;
  background:#0079c1;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
}

#submitBtn:disabled{
  background:#9e9e9e;
  cursor:not-allowed;
}

.mapButton{
  display:block;
  margin-top:5px;
  padding:6px 10px;
  background:#0079c1;
  color:#fff;
  border:none;
  border-radius:3px;
  cursor:pointer;
  font-size:13px;
}

.mapButton:hover{ background:#005a8c; }
</style>
</head>

<body>
<div id="viewDiv"></div>

<div id="sidePanel">
  <h3>Add Cat Trapping Records</h3>
  <div id="message"></div>
  <div id="count">0 traps selected</div>

  <form id="relatedForm"></form>

  <button id="submitBtn" disabled>Add Records</button>
</div>

<script>
require([
  "esri/WebMap",
  "esri/views/MapView",
  "esri/widgets/Sketch/SketchViewModel",
  "esri/layers/GraphicsLayer"
], function(WebMap, MapView, SketchViewModel, GraphicsLayer){

  let formConfig = null;

  async function loadFormConfig() {
    const response = await fetch("./formConfig.json");
    formConfig = await response.json();
    buildForm(formConfig.fields);
  }

  function buildForm(fields){
    const form=document.getElementById("relatedForm");
    form.innerHTML="";
    fields.forEach(field=>{
      const label=document.createElement("label");
      label.innerText=field.label;
      form.appendChild(label);
      let input;
      if(field.type==="select"){
        input=document.createElement("select");
        const defaultOption=document.createElement("option");
        defaultOption.value="";
        defaultOption.innerText="--Select--";
        input.appendChild(defaultOption);
        field.domain.forEach(opt=>{
          const o=document.createElement("option");
          o.value=opt.value;
          o.innerText=opt.label;
          input.appendChild(o);
        });
      } else {
        input=document.createElement("input");
        input.type=field.type;
      }
      input.id=field.id;
      form.appendChild(input);
    });
  }

  const webmap=new WebMap({ portalItem:{ id:"552cdf8d85234994a53339f6fbacfa3b" } });

  const view=new MapView({
    container:"viewDiv",
    map:webmap
  });

  let trapsLayer, relatedTable, layerView;
  let selectedObjectIds = [];
  let selectedGlobalIDs = [];
  let highlightHandle = null;

  const sidePanel = document.getElementById("sidePanel");
  const countDiv = document.getElementById("count");
  const submitBtn = document.getElementById("submitBtn");
  const messageDiv = document.getElementById("message");

  function updateCount(){
    countDiv.innerText = selectedObjectIds.length + " traps selected";
    countDiv.style.color = "#0079c1";
    countDiv.style.fontWeight = "600";
    submitBtn.disabled = selectedObjectIds.length === 0;
  }

  function showMessage(message,type="info",duration=2000){
    messageDiv.innerText=message;
    messageDiv.style.display="block";

    if(type==="success"){
      messageDiv.style.background="#e6f4ea";
      messageDiv.style.color="#1b5e20";
      messageDiv.style.border="1px solid #a5d6a7";
    } else if(type==="error"){
      messageDiv.style.background="#fdecea";
      messageDiv.style.color="#b71c1c";
      messageDiv.style.border="1px solid #f5c6cb";
    } else {
      messageDiv.style.background="#e3f2fd";
      messageDiv.style.color="#0d47a1";
      messageDiv.style.border="1px solid #90caf9";
    }

    setTimeout(()=>{ messageDiv.style.display="none"; }, duration);
  }

  view.when(async () => {

    await loadFormConfig();

    trapsLayer = webmap.layers.find(l => l.type === "feature" && l.title === "Cat Traps");
    relatedTable = webmap.tables.find(t => t.title === "Cat Trapping Data");
    trapsLayer.popupEnabled = false;
    view.popup.autoOpenEnabled = false;
    layerView = await view.whenLayerView(trapsLayer);

    const lassoLayer = new GraphicsLayer();
    view.map.add(lassoLayer);

    const sketchVM = new SketchViewModel({
      view:view,
      layer:lassoLayer,
      polygonSymbol:{ type:"simple-fill", color:[0,0,255,0.1], outline:{ color:[0,0,255], width:1 } }
    });

    const lassoBtn = document.createElement("button");
    lassoBtn.innerText="Lasso Select";
    lassoBtn.className="mapButton";
    lassoBtn.onclick = () => sketchVM.create("polygon");

    const clearBtn = document.createElement("button");
    clearBtn.innerText="Clear Selection";
    clearBtn.className="mapButton";
    clearBtn.onclick = () => {
      if(highlightHandle) highlightHandle.remove();
      highlightHandle=null;
      selectedObjectIds=[];
      selectedGlobalIDs=[];
      document.getElementById("relatedForm").reset();
      updateCount();
      sidePanel.style.display="none";
    };

    view.ui.add(lassoBtn,"top-left");
    view.ui.add(clearBtn,"top-left");

    // FILTER DROPDOWN
    const filterWrapper=document.createElement("div");
    filterWrapper.style.display="flex";
    filterWrapper.style.flexDirection="column";
    filterWrapper.style.marginTop="5px";

    const filterContainer=document.createElement("div");
    filterContainer.style.background="#0079c1";
    filterContainer.style.padding="8px 10px";
    filterContainer.style.borderRadius="4px";
    filterContainer.style.fontSize="14px";
    filterContainer.style.color="#fff";

    const filterLabel=document.createElement("label");
    filterLabel.innerText="Filter Traps:";
    filterLabel.style.color="#fff";
    filterLabel.style.fontWeight="600";
    filterLabel.style.marginBottom="5px";

    const filterDropdown=document.createElement("select");
    filterDropdown.id="filterTraps";
    filterDropdown.style.width="100%";
    filterDropdown.style.padding="8px 10px";
    filterDropdown.style.border="1px solid #0079c1";
    filterDropdown.style.borderRadius="4px";
    filterDropdown.style.backgroundColor="#fff";
    filterDropdown.style.color="#0079c1";
    filterDropdown.style.cursor="pointer";

    const optionAll=document.createElement("option");
    optionAll.value=""; optionAll.innerText="All"; filterDropdown.appendChild(optionAll);

    const optionTriggered=document.createElement("option");
    optionTriggered.value="InUse_Triggered"; optionTriggered.innerText="Triggered Traps"; filterDropdown.appendChild(optionTriggered);

    filterContainer.appendChild(filterLabel);
    filterContainer.appendChild(filterDropdown);
    filterWrapper.appendChild(filterContainer);

    view.ui.add(filterWrapper,"top-left");

    filterDropdown.addEventListener("change",()=>{
      const val=filterDropdown.value;
      if(val==="InUse_Triggered") trapsLayer.definitionExpression="Status = 'InUse' AND Node_StatusID = 'Triggered'";
      else trapsLayer.definitionExpression="Status IN ('InUse','Missing','Planned','Broken','Closed')";
      if(highlightHandle) highlightHandle.remove();
      highlightHandle=null;
      selectedObjectIds=[]; selectedGlobalIDs=[];
      document.getElementById("relatedForm").reset();
      updateCount();
      sidePanel.style.display="none";
    });

    // LASSO SELECTION
    sketchVM.on("create", async event=>{
      if(event.state!=="complete") return;
      const polygon=event.graphic.geometry;
      const query=trapsLayer.createQuery();
      query.geometry=polygon;
      query.spatialRelationship="intersects";
      query.outFields=["OBJECTID"];
      query.returnGeometry=false;

      const results=await layerView.queryFeatures(query);

      for(const f of results.features){
        const objectId=f.attributes[trapsLayer.objectIdField];
        const fullQuery=trapsLayer.createQuery();
        fullQuery.objectIds=[objectId];
        fullQuery.outFields=["GlobalID"];
        fullQuery.returnGeometry=false;
        const fullFeature=(await trapsLayer.queryFeatures(fullQuery)).features[0];
        if(!fullFeature) continue;
        const globalId=fullFeature.attributes.GlobalID;
        if(!selectedObjectIds.includes(objectId) && globalId){
          selectedObjectIds.push(objectId);
          selectedGlobalIDs.push(globalId);
        }
      }

      if(highlightHandle) highlightHandle.remove();
      highlightHandle=layerView.highlight(selectedObjectIds);

      updateCount();
      sidePanel.style.display="block";

      const dateField=formConfig.fields.find(f=>f.type==="datetime-local");
      if(dateField){
        const dateInput=document.getElementById(dateField.id);
        if(dateInput && !dateInput.value) dateInput.value=new Date().toISOString().slice(0,16);
      }

      lassoLayer.removeAll();
    });

  }); // view.when

  // POINT CLICK SELECTION
  view.on("click", async event=>{
    const hit=await view.hitTest(event,{ include:[trapsLayer] });
    if(!hit.results.length) return;
    const graphic=hit.results[0].graphic;
    const objectId=graphic.attributes[trapsLayer.objectIdField];
    const query=trapsLayer.createQuery(); query.objectIds=[objectId]; query.outFields=["GlobalID"]; query.returnGeometry=false;
    const result=await trapsLayer.queryFeatures(query);
    if(!result.features.length) return;
    const globalId=result.features[0].attributes.GlobalID;
    if(!selectedObjectIds.includes(objectId) && globalId){ selectedObjectIds.push(objectId); selectedGlobalIDs.push(globalId);}
    if(highlightHandle) highlightHandle.remove(); highlightHandle=layerView.highlight(selectedObjectIds);
    updateCount(); sidePanel.style.display="block";
    const dateField=formConfig.fields.find(f=>f.type==="datetime-local");
    if(dateField){ const dateInput=document.getElementById(dateField.id); if(dateInput && !dateInput.value) dateInput.value=new Date().toISOString().slice(0,16);}
  });

  // SUBMIT LOGIC
  submitBtn.onclick=async ()=>{
    if(!selectedGlobalIDs.length){ showMessage("Select at least one trap","error"); return;}
    submitBtn.disabled=true;

    const attributes={};
    for(const field of formConfig.fields){
      const value=document.getElementById(field.id).value;
      if(field.required && !value){ showMessage("Complete required fields","error"); submitBtn.disabled=false; return;}
      attributes[field.id]=value;
    }

    const addFeatures=selectedGlobalIDs.map(guid=>({ attributes:{ GUID:guid, ...attributes } }));

    try{
      const result=await relatedTable.applyEdits({ addFeatures });
      const failed=result.addFeatureResults.filter(r=>r.error!=null);
      if(failed.length===0){
        showMessage("Added "+addFeatures.length+" records","success");
        if(highlightHandle) highlightHandle.remove(); highlightHandle=null;
        selectedObjectIds=[]; selectedGlobalIDs=[];
        document.getElementById("relatedForm").reset(); submitBtn.disabled=true; updateCount();
      } else { showMessage("Some records failed. Check console.","error"); submitBtn.disabled=false;}
    } catch(err){ showMessage("Error adding records: "+err.message,"error"); submitBtn.disabled=false;}
  };

});
</script>
</body>
</html>
