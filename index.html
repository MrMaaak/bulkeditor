<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi Select Trap Records</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.30/"></script>

<style>
html, body, #viewDiv { height:100%; margin:0; padding:0; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }

#sidePanel{
  position:absolute;
  top:0;
  right:0;
  width:360px;
  height:100%;
  background:#fff;
  box-shadow:-4px 0 12px rgba(0,0,0,0.2);
  padding:20px;
  overflow-y:auto;
  display:none;
  z-index:10;
  border-left:1px solid #ddd;
}

#message{ 
  display:none;
  margin-bottom:10px;
  padding:8px 10px;
  border-radius:4px;
  font-size:14px;
}

#count{
  margin:15px 0;
  font-weight:600;
  color:#0079c1;
}

#relatedForm label{
  display:block;
  margin-top:15px;
  margin-bottom:5px;
  font-weight:600;
}

#relatedForm input, #relatedForm select{
  width:100%;
  padding:8px 10px;
  border:1px solid #ccc;
  border-radius:4px;
  font-size:14px;
  box-sizing:border-box;
}

#submitBtn{
  margin-top:20px;
  width:100%;
  padding:12px;
  background:#0079c1;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
}

#submitBtn:disabled{
  background:#9e9e9e;
  cursor:not-allowed;
}

#toolbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  max-width:280px;
  padding:6px;
  background:#fff;
  border-radius:6px;
  box-shadow:0 1px 4px rgba(0,0,0,0.3);
}

.mapButton{
  padding:7px 12px;
  background:#0079c1;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
  font-size:13px;
}

.mapButton:hover{ background:#005a8c; }

.mapButton.secondary{ background:#fff; color:#0079c1; border:1px solid #0079c1; }
.mapButton.secondary:hover{ background:#e3f2fd; }

.mapButton.active{ background:#d83020; }
.mapButton.active:hover{ background:#a82315; }

#toolbarHint{
  display:none;
  width:100%;
  font-size:12px;
  color:#555;
}

#signInOverlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
  background:#f5f5f5;
  z-index:20;
  text-align:center;
  padding:20px;
}

#signInBtn{
  padding:10px 20px;
  background:#0079c1;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:15px;
}
</style>
</head>

<body>
<div id="viewDiv"></div>

<div id="signInOverlay">
  <div id="signInText">Connect to your ArcGIS account to continue.</div>
  <button id="signInBtn">Continue with ArcGIS</button>
</div>

<div id="sidePanel">
  <h3>Add Cat Trapping Records</h3>
  <div id="message"></div>
  <div id="count">0 traps selected</div>

  <form id="relatedForm"></form>

  <button id="submitBtn" disabled>Add Records</button>
</div>

<script>
require([
  "esri/WebMap",
  "esri/views/MapView",
  "esri/widgets/Sketch/SketchViewModel",
  "esri/layers/GraphicsLayer",
  "esri/identity/OAuthInfo",
  "esri/identity/IdentityManager"
], function(WebMap, MapView, SketchViewModel, GraphicsLayer, OAuthInfo, esriId){
// The ArcGIS loader skips async callbacks, so the async work lives in this wrapper.
(async () => {

  // OAuth app registered in ArcGIS Online (Content > New item > Developer credentials > OAuth credentials).
  // Its redirect URLs must include this page's oauth-callback.html.
  const APP_ID = "iZVrlrTESdLg7Oyj";
  const PORTAL_URL = "https://www.arcgis.com";

  if(APP_ID !== "YOUR_APP_ID"){
    esriId.registerOAuthInfos([
      new OAuthInfo({ appId: APP_ID, portalUrl: PORTAL_URL, popup: true })
    ]);
  }

  // Reuse the ArcGIS session the user already has (e.g. from Experience Builder).
  // Only if no session is found do we show a one-click button; the popup it opens
  // closes itself straight away when the user is already signed in to ArcGIS Online.
  async function signIn(){
    const sharingUrl = PORTAL_URL + "/sharing";

    try {
      return await esriId.checkSignInStatus(sharingUrl);
    } catch {
      const overlay = document.getElementById("signInOverlay");
      const text = document.getElementById("signInText");
      overlay.style.display = "flex";

      return new Promise(resolve => {
        document.getElementById("signInBtn").onclick = async () => {
          try {
            const credential = await esriId.getCredential(sharingUrl);
            overlay.style.display = "none";
            resolve(credential);
          } catch(err) {
            text.innerText = "Sign in failed or was cancelled. Please try again.";
          }
        };
      });
    }
  }

  let formConfig = null;

  // Fetch the form config while the sign-in check runs, rather than after the map loads.
  const formConfigReady = loadFormConfig();

  // Until a real App ID is filled in, fall back to the standard ArcGIS sign-in prompt.
  if(APP_ID !== "YOUR_APP_ID") await signIn();

  async function loadFormConfig() {
    const response = await fetch("./formConfig.json");
    if (!response.ok) {
      throw new Error("Failed to load formConfig.json");
    }
    formConfig = await response.json();
    buildForm(formConfig.fields);
  }

  function buildForm(fields){
    const form=document.getElementById("relatedForm");
    form.innerHTML="";

    fields.forEach(field=>{
      const label=document.createElement("label");
      label.innerText=field.label;
      form.appendChild(label);

      let input;
      if(field.type==="select"){
        input=document.createElement("select");

        const defaultOption=document.createElement("option");
        defaultOption.value="";
        defaultOption.innerText="--Select--";
        input.appendChild(defaultOption);

        field.domain.forEach(opt=>{
          const o=document.createElement("option");
          o.value=opt.value;
          o.innerText=opt.label;
          input.appendChild(o);
        });
      } else {
        input=document.createElement("input");
        input.type=field.type;
      }

      input.id=field.id;
      form.appendChild(input);
    });
  }

  const webmap = new WebMap({
    portalItem: { id: "552cdf8d85234994a53339f6fbacfa3b" }
  });

  const view = new MapView({
    container: "viewDiv",
    map: webmap
  });

  let trapsLayer, relatedTable, layerView;
  const selected = new Map(); // objectId -> GlobalID
  let highlightHandle = null;

  const sidePanel = document.getElementById("sidePanel");
  const countDiv = document.getElementById("count");
  const submitBtn = document.getElementById("submitBtn");
  const messageDiv = document.getElementById("message");

  function updateCount(){
    countDiv.innerText = selected.size + (selected.size === 1 ? " trap selected" : " traps selected");
    submitBtn.disabled = selected.size === 0;
  }

  function refreshSelection(){
    if(highlightHandle) highlightHandle.remove();
    highlightHandle = selected.size && layerView ? layerView.highlight([...selected.keys()]) : null;
    updateCount();
    if(selected.size) sidePanel.style.display = "block";
  }

  function showMessage(message,type="info",duration=2000){
    messageDiv.innerText=message;
    messageDiv.style.display="block";

    messageDiv.style.background =
      type==="success" ? "#e6f4ea" :
      type==="error" ? "#fdecea" : "#e3f2fd";

    messageDiv.style.color =
      type==="success" ? "#1b5e20" :
      type==="error" ? "#b71c1c" : "#0d47a1";

    messageDiv.style.border="1px solid #ccc";

    setTimeout(()=>{ messageDiv.style.display="none"; }, duration);
  }

  view.when(async () => {

    await formConfigReady;

    trapsLayer = webmap.layers.find(l => l.type === "feature" && l.title === "Cat Traps");
    relatedTable = webmap.tables.find(t => t.title === "Cat Trapping Data");

    if(!trapsLayer){
      alert("Traps layer not found. Check layer title.");
      return;
    }

    if(!relatedTable){
      alert("Related table not found. Check table title.");
      return;
    }

    trapsLayer.popupEnabled = false;
    view.popup.autoOpenEnabled = false;

    // Load GlobalID with the features in the browser, so selecting needs no extra server requests.
    const oidField = trapsLayer.objectIdField;
    const gidField = trapsLayer.globalIdField || "GlobalID";
    trapsLayer.outFields = [oidField, gidField];

    layerView = await view.whenLayerView(trapsLayer);

    const lassoLayer = new GraphicsLayer({ listMode:"hide" });
    view.map.add(lassoLayer);

    const lassoSymbol = {
      type:"simple-fill",
      color:[0,121,193,0.12],
      outline:{ color:[0,121,193], width:2, style:"dash" }
    };

    // Freehand mode: press and drag around the traps, release to select.
    const sketchVM = new SketchViewModel({
      view: view,
      layer: lassoLayer,
      defaultCreateOptions:{ mode:"freehand" },
      polygonSymbol: lassoSymbol,
      activeFillSymbol: lassoSymbol
    });

    const toolbar = document.createElement("div");
    toolbar.id = "toolbar";

    const lassoBtn = document.createElement("button");
    lassoBtn.innerText="Lasso Select";
    lassoBtn.className="mapButton";

    const clearBtn = document.createElement("button");
    clearBtn.innerText="Clear Selection";
    clearBtn.className="mapButton secondary";

    const hint = document.createElement("div");
    hint.id = "toolbarHint";
    hint.innerText = "Drag around traps to select. Esc to cancel.";

    toolbar.append(lassoBtn, clearBtn, hint);
    view.ui.add(toolbar,"top-left");

    function setLassoActive(active){
      lassoBtn.classList.toggle("active", active);
      lassoBtn.innerText = active ? "Cancel Lasso" : "Lasso Select";
      hint.style.display = active ? "block" : "none";
      view.container.style.cursor = active ? "crosshair" : "";
    }

    lassoBtn.onclick = () => {
      if(sketchVM.state === "active"){
        sketchVM.cancel();
        return;
      }
      sketchVM.create("polygon");
      setLassoActive(true);
    };

    clearBtn.onclick = () => {
      if(sketchVM.state === "active") sketchVM.cancel();
      selected.clear();
      refreshSelection();
      document.getElementById("relatedForm").reset();
      sidePanel.style.display="none";
    };

    sketchVM.on("create", async event=>{
      if(event.state === "cancel"){
        setLassoActive(false);
        lassoLayer.removeAll();
        return;
      }
      if(event.state!=="complete") return;

      setLassoActive(false);
      lassoLayer.removeAll();

      const query=layerView.createQuery();
      query.geometry=event.graphic.geometry;
      query.spatialRelationship="intersects";
      query.outFields=[oidField, gidField];
      query.returnGeometry=false;

      const { features }=await layerView.queryFeatures(query);

      for(const f of features){
        const globalId=f.attributes[gidField];
        if(globalId) selected.set(f.attributes[oidField], globalId);
      }

      refreshSelection();
    });

    // Click a trap to add it; click a selected trap again to remove it.
    view.on("click", async event=>{
      if(sketchVM.state === "active") return;

      const hit=await view.hitTest(event,{ include:[trapsLayer] });
      const graphic=hit.results[0]?.graphic;
      if(!graphic) return;

      const objectId=graphic.attributes[oidField];

      if(selected.has(objectId)){
        selected.delete(objectId);
      } else {
        let globalId=graphic.attributes[gidField];
        if(!globalId){
          const result=await trapsLayer.queryFeatures({ objectIds:[objectId], outFields:[gidField] });
          globalId=result.features[0]?.attributes[gidField];
        }
        if(globalId) selected.set(objectId, globalId);
      }

      refreshSelection();
    });

  });

  submitBtn.onclick=async ()=>{
    if(!selected.size){
      showMessage("Select at least one trap","error");
      return;
    }

    submitBtn.disabled=true;

    const attributes={};

    for(const field of formConfig.fields){
      const value=document.getElementById(field.id).value;

      if(field.required && !value){
        showMessage("Complete required fields","error");
        submitBtn.disabled=false;
        return;
      }

      attributes[field.id]=value;
    }

    const addFeatures=[...selected.values()].map(guid=>({
      attributes:{ GUID:guid, ...attributes }
    }));

    try{
      const result=await relatedTable.applyEdits({ addFeatures });
      const failed=result.addFeatureResults.filter(r=>r.error!=null);

      if(failed.length===0){
        showMessage("Added "+addFeatures.length+" records","success");

        selected.clear();
        refreshSelection();
        document.getElementById("relatedForm").reset();
      } else {
        showMessage("Some records failed","error");
        submitBtn.disabled=false;
      }

    } catch(err){
      showMessage("Error adding records: "+err.message,"error");
      submitBtn.disabled=false;
    }
  };

})();
});
</script>

</body>
</html>
