<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi Select Trap Records</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.30/"></script>

<style>
html, body, #viewDiv { height:100%; margin:0; padding:0; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }

#sidePanel{
  position:absolute;
  top:0;
  right:0;
  width:360px;
  height:100%;
  background:#fff;
  box-shadow:-4px 0 12px rgba(0,0,0,0.2);
  padding:20px;
  overflow-y:auto;
  display:none;
  z-index:10;
  border-left:1px solid #ddd;
}

#message{ display:none; margin-bottom:10px; padding:8px 10px; border-radius:4px; font-size:14px; }
#count{ margin:15px 0; font-weight:600; color:#0079c1; }

#relatedForm label{ display:block; margin-top:15px; margin-bottom:5px; font-weight:600; }

#relatedForm input, #relatedForm select{
  width:100%;
  padding:8px 10px;
  border:1px solid #ccc;
  border-radius:4px;
  font-size:14px;
  box-sizing:border-box;
}

#submitBtn{
  margin-top:20px;
  width:100%;
  padding:12px;
  background:#0079c1;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
}

#submitBtn:disabled{ background:#9e9e9e; cursor:not-allowed; }

.mapButton{
  display:block;
  margin-top:5px;
  padding:6px 10px;
  background:#0079c1;
  color:#fff;
  border:none;
  border-radius:3px;
  cursor:pointer;
  font-size:13px;
}

.mapButton:hover{ background:#005a8c; }
</style>
</head>

<body>
<div id="viewDiv"></div>

<div id="sidePanel">
  <h3>Add Cat Trapping Records</h3>
  <div id="message"></div>
  <div id="count">0 traps selected</div>
  <form id="relatedForm"></form>
  <button id="submitBtn" disabled>Add Records</button>
</div>

<script>
require([], function(){

require([
  "esri/WebMap",
  "esri/views/MapView",
  "esri/widgets/Sketch/SketchViewModel",
  "esri/layers/GraphicsLayer"
], async function(WebMap, MapView, SketchViewModel, GraphicsLayer){

  let formConfig = null;

  async function loadFormConfig() {
    const response = await fetch("./formConfig.json");
    if (!response.ok) throw new Error("Failed to load formConfig.json");
    formConfig = await response.json();
    buildForm(formConfig.fields);
  }

  function buildForm(fields){
    const form=document.getElementById("relatedForm");
    form.innerHTML="";
    fields.forEach(field=>{
      const label=document.createElement("label");
      label.innerText=field.label;
      form.appendChild(label);

      let input;
      if(field.type==="select"){
        input=document.createElement("select");
        const defaultOption=document.createElement("option");
        defaultOption.value="";
        defaultOption.innerText="--Select--";
        input.appendChild(defaultOption);

        field.domain.forEach(opt=>{
          const o=document.createElement("option");
          o.value=opt.value;
          o.innerText=opt.label;
          input.appendChild(o);
        });
      } else {
        input=document.createElement("input");
        input.type=field.type;
      }

      input.id=field.id;
      form.appendChild(input);
    });
  }

  try {
    await loadFormConfig();
  } catch (err) {
    console.error(err);
    alert("Failed to load formConfig.json");
    return;
  }

  const webmap=new WebMap({ portalItem:{ id: formConfig.map.portalItemId } });
  const view=new MapView({ container:"viewDiv", map:webmap });

  let trapsLayer, relatedTable, layerView;
  let selectedObjectIds = [];
  let selectedGlobalIDs = [];
  let highlightHandle = null;

  const sidePanel = document.getElementById("sidePanel");
  const countDiv = document.getElementById("count");
  const submitBtn = document.getElementById("submitBtn");
  const messageDiv = document.getElementById("message");

  function updateCount(){
    countDiv.innerText = selectedObjectIds.length + " traps selected";
    submitBtn.disabled = selectedObjectIds.length === 0;
  }

  function showMessage(message,type="info",duration=2000){
    messageDiv.innerText=message;
    messageDiv.style.display="block";
    setTimeout(()=>{ messageDiv.style.display = "none"; }, duration);
  }

  view.when(async () => {

    trapsLayer = webmap.layers.find(l => l.type === "feature" && l.title === formConfig.layers.trapsLayer);
    relatedTable = webmap.tables.find(t => t.title === formConfig.layers.relatedTable);

    if(!trapsLayer){
      alert("Layer not found - check name in config");
      return;
    }

    layerView = await view.whenLayerView(trapsLayer);

    const lassoLayer = new GraphicsLayer();
    view.map.add(lassoLayer);

    const sketchVM = new SketchViewModel({
      view:view,
      layer:lassoLayer,
      polygonSymbol:{ type:"simple-fill", color:[0,0,255,0.1], outline:{ color:[0,0,255], width:1 } }
    });

    const lassoBtn = document.createElement("button");
    lassoBtn.innerText="Lasso Select";
    lassoBtn.className="mapButton";
    lassoBtn.onclick = () => sketchVM.create("polygon");

    const clearBtn = document.createElement("button");
    clearBtn.innerText="Clear Selection";
    clearBtn.className="mapButton";
    clearBtn.onclick = () => {
      if(highlightHandle) highlightHandle.remove();
      highlightHandle=null;
      selectedObjectIds=[];
      selectedGlobalIDs=[];
      document.getElementById("relatedForm").reset();
      updateCount();
      sidePanel.style.display="none";
    };

    view.ui.add(lassoBtn,"top-left");
    view.ui.add(clearBtn,"top-left");

    sketchVM.on("create", async event=>{
      if(event.state!=="complete") return;

      const query=trapsLayer.createQuery();
      query.geometry=event.graphic.geometry;
      query.spatialRelationship="intersects";
      query.outFields=["OBJECTID"];

      const results=await layerView.queryFeatures(query);

      for(const f of results.features){
        const objectId=f.attributes[trapsLayer.objectIdField];

        const fullQuery=trapsLayer.createQuery();
        fullQuery.objectIds=[objectId];
        fullQuery.outFields=["GlobalID"];

        const fullFeature=(await trapsLayer.queryFeatures(fullQuery)).features[0];
        if(!fullFeature) continue;

        const globalId=fullFeature.attributes.GlobalID;

        if(!selectedObjectIds.includes(objectId) && globalId){
          selectedObjectIds.push(objectId);
          selectedGlobalIDs.push(globalId);
        }
      }

      if(highlightHandle) highlightHandle.remove();
      highlightHandle=layerView.highlight(selectedObjectIds);

      updateCount();
      sidePanel.style.display="block";
      lassoLayer.removeAll();
    });

    view.on("click", async event=>{
      const hit=await view.hitTest(event,{ include:[trapsLayer] });
      if(!hit.results.length) return;

      const graphic=hit.results[0].graphic;
      const objectId=graphic.attributes[trapsLayer.objectIdField];

      const query=trapsLayer.createQuery();
      query.objectIds=[objectId];
      query.outFields=["GlobalID"];

      const result=await trapsLayer.queryFeatures(query);
      if(!result.features.length) return;

      const globalId=result.features[0].attributes.GlobalID;

      if(!selectedObjectIds.includes(objectId) && globalId){
        selectedObjectIds.push(objectId);
        selectedGlobalIDs.push(globalId);
      }

      if(highlightHandle) highlightHandle.remove();
      highlightHandle=layerView.highlight(selectedObjectIds);

      updateCount();
      sidePanel.style.display="block";
    });

  });

  submitBtn.onclick=async ()=>{
    if(!selectedGlobalIDs.length){
      showMessage("Select at least one trap","error");
      return;
    }

    submitBtn.disabled=true;

    const attributes={};
    for(const field of formConfig.fields){
      const value=document.getElementById(field.id).value;
      if(field.required && !value){
        showMessage("Complete required fields","error");
        submitBtn.disabled=false;
        return;
      }
      attributes[field.id]=value;
    }

    const addFeatures=selectedGlobalIDs.map(guid=>({
      attributes:{ GUID:guid, ...attributes }
    }));

    try{
      const result=await relatedTable.applyEdits({ addFeatures });
      const failed=result.addFeatureResults.filter(r=>r.error!=null);

      if(failed.length===0){
        showMessage("Added "+addFeatures.length+" records","success");

        if(highlightHandle) highlightHandle.remove();
        highlightHandle=null;
        selectedObjectIds=[];
        selectedGlobalIDs=[];
        document.getElementById("relatedForm").reset();
        submitBtn.disabled=true;
        updateCount();
      } else {
        showMessage("Some records failed","error");
        submitBtn.disabled=false;
      }
    } catch(err){
      showMessage("Error: "+err.message,"error");
      submitBtn.disabled=false;
    }
  };

}); // require

</script>

</body>
</html>
