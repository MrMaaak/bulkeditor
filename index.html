<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi Select Trap Records</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.30/"></script>

<style>
html, body, #viewDiv { height:100%; margin:0; padding:0; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }

#sidePanel{
  position:absolute;
  top:0;
  right:0;
  width:360px;
  height:100%;
  background:#fff;
  box-shadow:-4px 0 12px rgba(0,0,0,0.2);
  padding:20px;
  overflow-y:auto;
  display:none;
  z-index:10;
  border-left:1px solid #ddd;
}

#message{ 
  display:none;
  margin-bottom:10px;
  padding:8px 10px;
  border-radius:4px;
  font-size:14px;
}

#count{
  margin:15px 0;
  font-weight:600;
  color:#0079c1;
}

#relatedForm label{
  display:block;
  margin-top:15px;
  margin-bottom:5px;
  font-weight:600;
}

#relatedForm input, #relatedForm select{
  width:100%;
  padding:8px 10px;
  border:1px solid #ccc;
  border-radius:4px;
  font-size:14px;
  box-sizing:border-box;
}

#submitBtn{
  margin-top:20px;
  width:100%;
  padding:12px;
  background:#0079c1;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
}

#submitBtn:disabled{
  background:#9e9e9e;
  cursor:not-allowed;
}

.mapButton{
  display:block;
  margin-top:5px;
  padding:6px 10px;
  background:#0079c1;
  color:#fff;
  border:none;
  border-radius:3px;
  cursor:pointer;
  font-size:13px;
}

.mapButton:hover{ background:#005a8c; }
</style>
</head>

<body>
<div id="viewDiv"></div>

<div id="sidePanel">
  <h3>Add Cat Trapping Records</h3>

  <div id="message"></div>
  <div id="count">0 traps selected</div>

  <form id="relatedForm">
    <label>Date Checked</label>
    <input type="datetime-local" id="DateChecked">

    <label>Trap State</label>
    <select id="TrapState_1">
      <option value="">--Select--</option>
      <option value="Set">Set</option>
      <option value="SprungCaught">SprungCaught</option>
      <option value="SprungEmpty">SprungEmpty</option>
      <option value="Closed">Closed</option>
    </select>

    <label>Leave trap closed?</label>
    <select id="ClosingTrap">
      <option value="">--Select--</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>
  </form>

  <button id="submitBtn" disabled>Add Records</button>
</div>

<script>
require([
  "esri/WebMap",
  "esri/views/MapView",
  "esri/widgets/Sketch/SketchViewModel",
  "esri/layers/GraphicsLayer"
], function(WebMap, MapView, SketchViewModel, GraphicsLayer){

  const webmap = new WebMap({
    portalItem: { id: "552cdf8d85234994a53339f6fbacfa3b" }
  });

  const view = new MapView({
    container: "viewDiv",
    map: webmap
  });

  let trapsLayer, relatedTable, layerView;
  let selectedObjectIds = [];
  let selectedGlobalIDs = [];
  let highlightHandle = null;

  const sidePanel = document.getElementById("sidePanel");
  const countDiv = document.getElementById("count");
  const submitBtn = document.getElementById("submitBtn");
  const messageDiv = document.getElementById("message");

  function updateCount(){
    countDiv.innerText = selectedObjectIds.length + " traps selected";
    submitBtn.disabled = selectedObjectIds.length === 0;
  }

  function showMessage(message, type="info", duration=2000){
    messageDiv.innerText = message;
    messageDiv.style.display = "block";
    messageDiv.style.background =
      type==="success" ? "#e6f4ea" :
      type==="error" ? "#fdecea" : "#e3f2fd";
    setTimeout(()=> messageDiv.style.display="none", duration);
  }

  view.when(async () => {
    trapsLayer = webmap.layers.find(l => l.type === "feature" && l.title === "Cat Traps");
    relatedTable = webmap.tables.find(t => t.title === "Cat Trapping Data");

    trapsLayer.popupEnabled = false;
    view.popup.autoOpenEnabled = false;

    layerView = await view.whenLayerView(trapsLayer);

    /* ---------------- FILTER BUTTON ---------------- */
    let filterOn = false;

    const filterBtn = document.createElement("button");
    filterBtn.innerText = "Filter: InUse + Triggered";
    filterBtn.className = "mapButton";

    filterBtn.onclick = () => {
      filterOn = !filterOn;

      if (filterOn) {
        layerView.filter = {
          where: "Status = 'InUse' AND Node_StatusID = 'Triggered'"
        };
        filterBtn.innerText = "Clear Filter";
        filterBtn.style.background = "#d32f2f";
      } else {
        layerView.filter = null;
        filterBtn.innerText = "Filter: InUse + Triggered";
        filterBtn.style.background = "#0079c1";
      }

      if (highlightHandle) highlightHandle.remove();
      highlightHandle = null;
      selectedObjectIds = [];
      selectedGlobalIDs = [];
      updateCount();
      sidePanel.style.display = "none";
    };

    view.ui.add(filterBtn,"top-left");
    /* ------------------------------------------------ */

    const lassoLayer = new GraphicsLayer();
    view.map.add(lassoLayer);

    const sketchVM = new SketchViewModel({
      view: view,
      layer: lassoLayer
    });

    const lassoBtn = document.createElement("button");
    lassoBtn.innerText="Lasso Select";
    lassoBtn.className="mapButton";
    lassoBtn.onclick = () => sketchVM.create("polygon");

    const clearBtn = document.createElement("button");
    clearBtn.innerText="Clear Selection";
    clearBtn.className="mapButton";
    clearBtn.onclick = () => {
      if(highlightHandle) highlightHandle.remove();
      highlightHandle = null;
      selectedObjectIds = [];
      selectedGlobalIDs = [];
      document.getElementById("relatedForm").reset();
      updateCount();
      sidePanel.style.display = "none";
    };

    view.ui.add(lassoBtn,"top-left");
    view.ui.add(clearBtn,"top-left");

    sketchVM.on("create", async event => {
      if(event.state !== "complete") return;

      const query = trapsLayer.createQuery();
      query.geometry = event.graphic.geometry;
      query.spatialRelationship = "intersects";
      query.outFields = ["OBJECTID","GlobalID"];
      query.returnGeometry = false;

      const results = await layerView.queryFeatures(query);

      results.features.forEach(f => {
        const oid = f.attributes[trapsLayer.objectIdField];
        const gid = f.attributes.GlobalID;
        if(!selectedObjectIds.includes(oid) && gid){
          selectedObjectIds.push(oid);
          selectedGlobalIDs.push(gid);
        }
      });

      if(highlightHandle) highlightHandle.remove();
      highlightHandle = layerView.highlight(selectedObjectIds);

      updateCount();
      sidePanel.style.display = "block";
      lassoLayer.removeAll();
    });
  });

  view.on("click", async event => {
    const hit = await view.hitTest(event, { include: [trapsLayer] });
    if(!hit.results.length) return;

    const graphic = hit.results[0].graphic;
    const oid = graphic.attributes[trapsLayer.objectIdField];
    const gid = graphic.attributes.GlobalID;

    if(!selectedObjectIds.includes(oid) && gid){
      selectedObjectIds.push(oid);
      selectedGlobalIDs.push(gid);
    }

    if(highlightHandle) highlightHandle.remove();
    highlightHandle = layerView.highlight(selectedObjectIds);

    updateCount();
    sidePanel.style.display = "block";
  });

  submitBtn.onclick = async () => {
    if(!selectedGlobalIDs.length){
      showMessage("Select at least one trap","error");
      return;
    }

    const addFeatures = selectedGlobalIDs.map(gid => ({
      attributes:{
        GUID: gid,
        DateChecked: document.getElementById("DateChecked").value,
        TrapState_1: document.getElementById("TrapState_1").value,
        ClosingTrap: document.getElementById("ClosingTrap").value
      }
    }));

    const result = await relatedTable.applyEdits({ addFeatures });
    showMessage("Added "+addFeatures.length+" records","success");

    if(highlightHandle) highlightHandle.remove();
    selectedObjectIds=[];
    selectedGlobalIDs=[];
    updateCount();
  };
});
</script>
</body>
</html>
