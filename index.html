<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi Select Trap Records</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.30/"></script>

<style>
html, body, #viewDiv { height:100%; margin:0; padding:0; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }

#sidePanel{
  position:absolute;
  top:0;
  right:0;
  width:360px;
  height:100%;
  background:#fff;
  box-shadow:-4px 0 12px rgba(0,0,0,0.2);
  padding:20px;
  overflow-y:auto;
  display:none;
  z-index:10;
  border-left:1px solid #ddd;
}

#count{
  margin:15px 0;
  font-weight:600;
  color:#0079c1;
}

#messageBox{
  display:none;
  margin-bottom:15px;
  padding:10px;
  border-radius:4px;
  font-size:14px;
}

#relatedForm label{
  display:block;
  margin-top:15px;
  margin-bottom:5px;
  font-weight:600;
}

#relatedForm input, #relatedForm select{
  width:100%;
  padding:8px 10px;
  border:1px solid #ccc;
  border-radius:4px;
  font-size:14px;
  box-sizing:border-box;
}

#submitBtn{
  margin-top:20px;
  width:100%;
  padding:12px;
  background:#0079c1;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
}

#submitBtn:disabled{
  background:#9e9e9e;
  cursor:not-allowed;
}

.mapButton{
  display:block;
  margin-top:5px;
  padding:6px 10px;
  background:#0079c1;
  color:#fff;
  border:none;
  border-radius:3px;
  cursor:pointer;
  font-size:13px;
}

.mapButton:hover{ background:#005a8c; }
</style>
</head>

<body>
<div id="viewDiv"></div>

<div id="sidePanel">
  <h3>Add Cat Trapping Records</h3>
  <div id="messageBox"></div>
  <div id="count">0 traps selected</div>

  <form id="relatedForm">
    <label>Date Checked</label>
    <input type="datetime-local" id="DateChecked">

    <label>Trap State</label>
    <select id="TrapState_1">
      <option value="">--Select--</option>
      <option value="Set">Set</option>
      <option value="SprungCaught">SprungCaught</option>
      <option value="SprungEmpty">SprungEmpty</option>
      <option value="Closed">Closed</option>
    </select>

    <label>Leave trap closed?</label>
    <select id="ClosingTrap">
      <option value="">--Select--</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>
  </form>

  <button id="submitBtn" disabled>Add Records</button>
</div>

<script>
require([
  "esri/WebMap",
  "esri/views/MapView",
  "esri/widgets/Sketch/SketchViewModel",
  "esri/layers/GraphicsLayer"
], function(WebMap, MapView, SketchViewModel, GraphicsLayer){

  const webmap = new WebMap({
    portalItem: { id: "552cdf8d85234994a53339f6fbacfa3b" }
  });

  const view = new MapView({
    container: "viewDiv",
    map: webmap
  });

  let trapsLayer, relatedTable, layerView;
  let selectedObjectIds = [];
  let selectedGlobalIDs = [];
  let highlightHandle = null;

  const sidePanel = document.getElementById("sidePanel");
  const countDiv = document.getElementById("count");
  const submitBtn = document.getElementById("submitBtn");
  const messageBox = document.getElementById("messageBox");

  function updateCount(){
    countDiv.innerText = selectedObjectIds.length + " traps selected";
    submitBtn.disabled = selectedObjectIds.length === 0;
  }

  function showMessage(message, type="info"){
    messageBox.innerText = message;
    messageBox.style.display = "block";

    if(type==="success"){
      messageBox.style.background="#e6f4ea";
      messageBox.style.color="#1b5e20";
      messageBox.style.border="1px solid #a5d6a7";
    } else {
      messageBox.style.background="#fdecea";
      messageBox.style.color="#b71c1c";
      messageBox.style.border="1px solid #f5c6cb";
    }
  }

  function clearAll(){
    selectedObjectIds = [];
    selectedGlobalIDs = [];
    if(highlightHandle) highlightHandle.remove();
    highlightHandle = null;
    document.getElementById("relatedForm").reset();
    updateCount();
    setTimeout(()=>{
      sidePanel.style.display="none";
      messageBox.style.display="none";
    },1500);
  }

  view.when(async () => {

    trapsLayer = webmap.layers.find(l => l.type === "feature" && l.title === "Cat Traps");
    relatedTable = webmap.tables.find(t => t.title === "Cat Trapping Data");

    trapsLayer.popupEnabled = false;
    view.popup.autoOpenEnabled = false;

    layerView = await view.whenLayerView(trapsLayer);

    const lassoLayer = new GraphicsLayer();
    view.map.add(lassoLayer);

    const sketchVM = new SketchViewModel({
      view:view,
      layer:lassoLayer,
      polygonSymbol:{
        type:"simple-fill",
        color:[0,0,255,0.1],
        outline:{color:[0,0,255],width:1}
      }
    });

    const lassoBtn = document.createElement("button");
    lassoBtn.innerText="Lasso Select";
    lassoBtn.className="mapButton";
    lassoBtn.onclick=()=>sketchVM.create("polygon");

    const clearBtn=document.createElement("button");
    clearBtn.innerText="Clear Selection";
    clearBtn.className="mapButton";
    clearBtn.onclick=clearAll;

    view.ui.add(lassoBtn,"top-left");
    view.ui.add(clearBtn,"top-left");

    sketchVM.on("create", async event=>{
      if(event.state!=="complete") return;

      const query=trapsLayer.createQuery();
      query.geometry=event.graphic.geometry;
      query.spatialRelationship="intersects";
      query.outFields=["OBJECTID"];

      const results=await layerView.queryFeatures(query);

      for(const f of results.features){
        const objectId=f.attributes[trapsLayer.objectIdField];

        const fullQuery=trapsLayer.createQuery();
        fullQuery.objectIds=[objectId];
        fullQuery.outFields=["GlobalID"];

        const fullFeature=(await trapsLayer.queryFeatures(fullQuery)).features[0];
        if(!fullFeature) continue;

        const globalId=fullFeature.attributes.GlobalID;

        if(!selectedObjectIds.includes(objectId) && globalId){
          selectedObjectIds.push(objectId);
          selectedGlobalIDs.push(globalId);
        }
      }

      if(highlightHandle) highlightHandle.remove();
      highlightHandle=layerView.highlight(selectedObjectIds);

      updateCount();
      sidePanel.style.display="block";

      const dateInput=document.getElementById("DateChecked");
      if(!dateInput.value)
        dateInput.value=new Date().toISOString().slice(0,16);

      lassoLayer.removeAll();
    });

  });

  view.on("click", async event=>{
    const hit=await view.hitTest(event,{include:[trapsLayer]});
    if(!hit.results.length) return;

    const graphic=hit.results[0].graphic;
    const objectId=graphic.attributes[trapsLayer.objectIdField];

    const query=trapsLayer.createQuery();
    query.objectIds=[objectId];
    query.outFields=["GlobalID"];

    const result=await trapsLayer.queryFeatures(query);
    if(!result.features.length) return;

    const globalId=result.features[0].attributes.GlobalID;

    if(!selectedObjectIds.includes(objectId) && globalId){
      selectedObjectIds.push(objectId);
      selectedGlobalIDs.push(globalId);
    }

    if(highlightHandle) highlightHandle.remove();
    highlightHandle=layerView.highlight(selectedObjectIds);

    updateCount();
    sidePanel.style.display="block";

    const dateInput=document.getElementById("DateChecked");
    if(!dateInput.value)
      dateInput.value=new Date().toISOString().slice(0,16);
  });

  submitBtn.onclick=async ()=>{
    if(!selectedGlobalIDs.length){
      showMessage("Select at least one trap","error");
      return;
    }

    const dateInput=document.getElementById("DateChecked").value;
    const trapState=document.getElementById("TrapState_1").value;
    const closingTrap=document.getElementById("ClosingTrap").value;

    if(!dateInput || !trapState || !closingTrap){
      showMessage("Complete required fields","error");
      return;
    }

    submitBtn.disabled=true;

    const addFeatures=selectedGlobalIDs.map(guid=>({
      attributes:{
        GUID:guid,
        DateChecked:dateInput,
        TrapState_1:trapState,
        ClosingTrap:closingTrap
      }
    }));

    try{
      const result=await relatedTable.applyEdits({addFeatures});
      const failed=result.addFeatureResults.filter(r=>r.error!=null);

      if(failed.length===0){
        showMessage("Successfully added "+addFeatures.length+" records","success");
        clearAll();
      } else {
        showMessage("Some records failed. Check console.","error");
        submitBtn.disabled=false;
      }

    } catch(err){
      showMessage("Error adding records: "+err.message,"error");
      submitBtn.disabled=false;
    }
  };

});
</script>
</body>
</html>
