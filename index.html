<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi Select Trap Records</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.30/"></script>

<style>
html, body, #viewDiv { height:100%; margin:0; padding:0; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }

#sidePanel{
  position:absolute;
  top:0;
  right:0;
  width:360px;
  height:100%;
  background:#fff;
  box-shadow:-4px 0 12px rgba(0,0,0,0.2);
  padding:20px;
  overflow-y:auto;
  display:none;
  z-index:10;
}

#count{ margin:15px 0; font-weight:600; color:#0079c1; }

.mapButton{
  display:block;
  margin-top:5px;
  padding:6px 10px;
  background:#0079c1;
  color:#fff;
  border:none;
  border-radius:3px;
  cursor:pointer;
  font-size:13px;
}
.mapButton:hover{ background:#005a8c; }

#submitBtn{
  width:100%;
  margin-top:20px;
  padding:12px;
  background:#0079c1;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:16px;
}
#submitBtn:disabled{ background:#9e9e9e; }
</style>
</head>

<body>
<div id="viewDiv"></div>

<div id="sidePanel">
  <h3>Add Cat Trapping Records</h3>
  <div id="count">0 traps selected</div>

  <label>Date Checked</label>
  <input type="datetime-local" id="DateChecked">

  <label>Trap State</label>
  <select id="TrapState_1">
    <option value="">--Select--</option>
    <option value="Set">Set</option>
    <option value="SprungCaught">SprungCaught</option>
    <option value="SprungEmpty">SprungEmpty</option>
    <option value="Closed">Closed</option>
  </select>

  <label>Leave trap closed?</label>
  <select id="ClosingTrap">
    <option value="">--Select--</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>

  <button id="submitBtn" disabled>Add Records</button>
</div>

<script>
require([
  "esri/WebMap",
  "esri/views/MapView",
  "esri/widgets/Sketch/SketchViewModel",
  "esri/layers/GraphicsLayer"
], function(WebMap, MapView, SketchViewModel, GraphicsLayer){

  const webmap = new WebMap({
    portalItem:{ id:"552cdf8d85234994a53339f6fbacfa3b" }
  });

  const view = new MapView({
    container:"viewDiv",
    map:webmap
  });

  let trapsLayer, relatedTable, layerView;
  let selectedOIDs = [];
  let selectedGIDs = [];
  let highlightHandle = null;

  const sidePanel = document.getElementById("sidePanel");
  const countDiv = document.getElementById("count");
  const submitBtn = document.getElementById("submitBtn");

  function updateUI(){
    countDiv.innerText = selectedOIDs.length + " traps selected";
    submitBtn.disabled = selectedOIDs.length === 0;
  }

  view.when(async () => {
    trapsLayer = webmap.layers.find(l => l.title === "Cat Traps");
    relatedTable = webmap.tables.find(t => t.title === "Cat Trapping Data");

    trapsLayer.popupEnabled = false;
    view.popup.autoOpenEnabled = false;

    layerView = await view.whenLayerView(trapsLayer);

    /* -------- FILTER BUTTON -------- */
    let filterOn = false;
    const filterBtn = document.createElement("button");
    filterBtn.className = "mapButton";
    filterBtn.innerText = "Filter: InUse + Triggered";

    filterBtn.onclick = () => {
      filterOn = !filterOn;

      layerView.filter = filterOn ? {
        where:"Status = 'InUse' AND Node_StatusID = 'Triggered'"
      } : null;

      filterBtn.innerText = filterOn ? "Clear Filter" : "Filter: InUse + Triggered";

      if (highlightHandle) highlightHandle.remove();
      selectedOIDs = [];
      selectedGIDs = [];
      updateUI();
      sidePanel.style.display = "none";
    };

    view.ui.add(filterBtn,"top-left");
    /* -------------------------------- */

    const lassoLayer = new GraphicsLayer();
    view.map.add(lassoLayer);

    const sketchVM = new SketchViewModel({
      view:view,
      layer:lassoLayer
    });

    const lassoBtn = document.createElement("button");
    lassoBtn.className="mapButton";
    lassoBtn.innerText="Lasso Select";
    lassoBtn.onclick=()=>sketchVM.create("polygon");

    const clearBtn = document.createElement("button");
    clearBtn.className="mapButton";
    clearBtn.innerText="Clear Selection";
    clearBtn.onclick=()=>{
      if(highlightHandle) highlightHandle.remove();
      selectedOIDs=[];
      selectedGIDs=[];
      updateUI();
      sidePanel.style.display="none";
    };

    view.ui.add(lassoBtn,"top-left");
    view.ui.add(clearBtn,"top-left");

    /* -------- LASSO SELECTION -------- */
    sketchVM.on("create", async e=>{
      if(e.state!=="complete") return;

      const q = layerView.createQuery();
      q.geometry = e.graphic.geometry;
      q.spatialRelationship="intersects";
      q.outFields=["OBJECTID","GlobalID"];
      q.returnGeometry=false;

      const res = await layerView.queryFeatures(q);

      res.features.forEach(f=>{
        const oid = f.attributes[trapsLayer.objectIdField];
        const gid = f.attributes.GlobalID;
        if(!selectedOIDs.includes(oid)){
          selectedOIDs.push(oid);
          selectedGIDs.push(gid);
        }
      });

      if(highlightHandle) highlightHandle.remove();
      highlightHandle = layerView.highlight(selectedOIDs);

      updateUI();
      sidePanel.style.display="block";
      lassoLayer.removeAll();
    });
  });

  /* -------- CLICK SELECTION -------- */
  view.on("click", async e=>{
    const hit = await view.hitTest(e,{ include:[trapsLayer] });
    if(!hit.results.length) return;

    const g = hit.results[0].graphic;
    const oid = g.attributes[trapsLayer.objectIdField];
    const gid = g.attributes.GlobalID;

    if(!selectedOIDs.includes(oid)){
      selectedOIDs.push(oid);
      selectedGIDs.push(gid);
    }

    if(highlightHandle) highlightHandle.remove();
    highlightHandle = layerView.highlight(selectedOIDs);

    updateUI();
    sidePanel.style.display="block";
  });

  /* -------- SUBMIT -------- */
  submitBtn.onclick = async ()=>{
    const adds = selectedGIDs.map(gid=>({
      attributes:{
        GUID:gid,
        DateChecked:DateChecked.value,
        TrapState_1:TrapState_1.value,
        ClosingTrap:ClosingTrap.value
      }
    }));

    await relatedTable.applyEdits({ addFeatures:adds });

    if(highlightHandle) highlightHandle.remove();
    selectedOIDs=[];
    selectedGIDs=[];
    updateUI();
    sidePanel.style.display="none";
  };
});
</script>
</body>
</html>
