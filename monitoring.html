<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monitoring Device Records</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<script src="https://js.arcgis.com/4.30/"></script>

<style>
/* Same TMT theme as index.html (cat trap records). */
:root{
  --panel:rgba(20,17,13,0.95);
  --panel-line:rgba(241,230,208,0.14);
  --field:#221e19;
  --field-line:#3d362e;
  --cream:#f1e6d0;
  --muted:#a8998a;
  --tan:#c7b497;
  --tan-hover:#d8c8ad;
  --ink:#12100d;
  --orange:#e08a3c;
  --green:#b9d3aa;
}

html, body, #viewDiv { height:100%; margin:0; padding:0; font-family:"Inter","Segoe UI",Tahoma,Geneva,Verdana,sans-serif; }

#sidePanel{
  position:absolute; top:16px; right:16px; bottom:16px; width:420px;
  box-sizing:border-box; display:none; flex-direction:column;
  background:var(--panel); color:var(--cream);
  border:1px solid var(--panel-line); border-radius:10px;
  box-shadow:0 12px 32px rgba(0,0,0,0.45);
  z-index:10; backdrop-filter:blur(6px);
}
#panelBody{ flex:1; overflow-y:auto; padding:20px 22px 8px; scrollbar-width:thin; scrollbar-color:var(--field-line) transparent; }
#panelFoot{ padding:12px 22px 18px; border-top:1px solid var(--panel-line); }

#sidePanel h3{ margin:0; font-size:18px; font-weight:700; }
.sub{ margin:4px 0 0; font-size:13px; color:var(--muted); line-height:1.4; }
#dryRunBadge{ display:none; margin-top:10px; padding:6px 10px; border-radius:6px; font-size:12px; font-weight:600;
  background:rgba(224,138,60,0.16); border:1px solid rgba(224,138,60,0.5); color:#f0b27a; }

#message{ display:none; margin-top:14px; padding:9px 12px; border-radius:6px; font-size:13px; border:1px solid transparent; white-space:pre-line; }

h4{ margin:22px 0 8px; font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted);
  display:flex; justify-content:space-between; align-items:center; }
#count{ padding:3px 10px; border-radius:999px; background:rgba(199,180,151,0.16); border:1px solid rgba(199,180,151,0.4);
  color:var(--tan); font-size:12px; letter-spacing:0; text-transform:none; }

input, select, textarea{
  width:100%; padding:9px 11px; background:var(--field); color:var(--cream);
  border:1px solid var(--field-line); border-radius:6px; font-size:14px; font-family:inherit;
  box-sizing:border-box; color-scheme:dark; outline:none; transition:border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus{ border-color:var(--tan); box-shadow:0 0 0 3px rgba(199,180,151,0.2); }
input[readonly]{ color:var(--muted); }
textarea{ min-height:64px; resize:vertical; }

#findRow{ display:flex; gap:8px; }
#findRow button{ flex:0 0 auto; width:auto; }

#selList{ border:1px solid var(--field-line); border-radius:6px; max-height:260px; overflow-y:auto; }
#selList:empty::before{ content:"Lasso or click devices on the map, or type Device IDs above."; display:block; padding:12px; font-size:13px; color:var(--muted); }
.row{ display:grid; grid-template-columns:1fr 82px 26px; gap:8px; align-items:center; padding:6px 8px 6px 10px; border-bottom:1px solid var(--field-line); font-size:13px; }
.row:last-child{ border-bottom:none; }
.row .id{ font-weight:600; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .meta{ display:block; font-weight:400; font-size:11px; color:var(--muted); }
.row select{ padding:4px 6px; font-size:13px; }
.row select.yes{ border-color:var(--orange); color:#f0b27a; }
.row .x{ background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:0; line-height:1; }
.row .x:hover{ color:var(--cream); }

#recordForm label{ display:block; margin-top:14px; margin-bottom:5px; font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
#recordForm label .required{ color:var(--tan); margin-left:2px; }
#recordForm .hint{ font-size:11px; color:var(--muted); margin-top:4px; }
.pair{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

button{ font-family:inherit; }
.btn{ width:100%; padding:9px 12px; background:var(--tan); color:var(--ink); border:1px solid var(--tan); border-radius:6px; cursor:pointer; font-size:13px; font-weight:600; transition:background .15s, color .15s; }
.btn:hover{ background:var(--tan-hover); }
.btn.secondary{ background:transparent; color:var(--cream); border-color:var(--field-line); }
.btn.secondary:hover{ background:rgba(241,230,208,0.08); }
.btn.active{ background:var(--orange); border-color:var(--orange); }
#submitBtn{ padding:12px; font-size:15px; font-weight:700; border-radius:8px; }
#submitBtn:disabled{ background:#3a342d; border-color:#3a342d; color:var(--muted); cursor:not-allowed; }

#toolbar{ display:flex; flex-direction:column; gap:8px; width:190px; padding:10px; background:var(--panel); color:var(--cream);
  border:1px solid var(--panel-line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.4); }
#toolbar select{ padding:7px 8px; font-size:13px; }
#toolbarHint{ display:none; font-size:12px; line-height:1.4; color:var(--muted); }

#signInOverlay{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px;
  background:var(--ink); color:var(--cream); z-index:20; text-align:center; padding:20px; }
#signInBtn{ padding:11px 22px; width:auto; font-size:15px; font-weight:700; border-radius:8px; }
</style>
</head>

<body>
<div id="viewDiv"></div>

<div id="signInOverlay">
  <div id="signInText">Connect to your ArcGIS account to continue.</div>
  <button id="signInBtn" class="btn">Continue with ArcGIS</button>
</div>

<div id="sidePanel">
  <div id="panelBody">
    <h3>Add monitoring device records</h3>
    <p class="sub">Select devices, fill in the record once, and one record is added for each device, linked to it with its Device ID.</p>
    <div id="dryRunBadge">Test mode (?dryrun=1): nothing is saved.</div>
    <div id="message"></div>

    <h4>Devices <span id="count">0 selected</span></h4>
    <div id="findRow">
      <input id="findInput" placeholder="Device IDs, e.g. RH3_12, RH3_13" autocomplete="off">
      <button id="findBtn" class="btn secondary">Add</button>
    </div>
    <div style="height:8px"></div>
    <div id="selList"></div>

    <h4>Record</h4>
    <form id="recordForm" autocomplete="off" onsubmit="return false"></form>
  </div>
  <div id="panelFoot">
    <button id="submitBtn" class="btn" disabled>Add records</button>
  </div>
</div>

<script>
// Mirrors the "Monitoring device records" form in the Broken Islands 2026 Field Map
// (web map 0a738179ced34f558d31e3c52ecafa15). Update both together.
const CONFIG = {
  webmapId: "0a738179ced34f558d31e3c52ecafa15",
  locationsUrl: "https://services3.arcgis.com/HYKqs4HgCmzergJk/arcgis/rest/services/TMT_Rodent_Biosecurity_View/FeatureServer/2",
  recordsUrl: "https://services3.arcgis.com/HYKqs4HgCmzergJk/arcgis/rest/services/TMT_Rodent_Biosecurity_View/FeatureServer/7",
  // Only these statuses are drawn on the field map (its renderer has no default symbol).
  statusFilter: "devicestatus IN ('Deployed','Broken','Missing','Planned')",
  // Location DeviceType -> record DeviceType (the two layers use different codes for tracking tunnels).
  deviceTypeMap: { TrackingTunnel:"TrackingCard", "Tracking tunnel":"TrackingCard", ChewCard:"ChewCard", WaxBlock:"WaxBlock" },
  yesNo: [{ value:1, label:"Yes" }, { value:0, label:"No" }],
  // Rat is entered per device in the list; the form field below sets every row at once.
  fields: [
    { id:"DateChecked", label:"Date Checked", type:"now", hint:"Set to the time you press Add records, as in Field Maps." },
    { id:"DeviceType", label:"Device Type", type:"select", required:true,
      domain:[{ value:"TrackingCard", label:"TrackingCard" }, { value:"WaxBlock", label:"WaxBlock" }, { value:"ChewCard", label:"ChewCard" }] },
    { pair:[
      { id:"DateDeployed", label:"Date Deployed", type:"datetime-local", required:true },
      { id:"DateRetrieved", label:"Date Retrieved", type:"datetime-local", required:true }
    ]},
    { id:"Rat", label:"Rat (set all devices)", type:"yesno", required:true, perRow:true },
    { id:"Bird", label:"Bird", type:"yesno" },
    { id:"Insect", label:"Insect", type:"yesno" },
    { id:"Other", label:"Other", type:"yesno" },
    { id:"OtherSpecifiy", label:"Specify Other", type:"text", maxLength:256, visibleIf:() => val("Other") === 1 },
    { id:"Comments_records", label:"Comments", type:"textarea", maxLength:1000 }
  ]
};
const flatFields = CONFIG.fields.flatMap(f => f.pair || [f]);
function val(id){
  const el = document.getElementById(id);
  if(!el || el.value === "") return null;
  const f = flatFields.find(x => x.id === id);
  return f.type === "yesno" ? Number(el.value) : el.value;
}

require([
  "esri/WebMap",
  "esri/views/MapView",
  "esri/layers/FeatureLayer",
  "esri/widgets/Sketch/SketchViewModel",
  "esri/layers/GraphicsLayer",
  "esri/identity/OAuthInfo",
  "esri/identity/IdentityManager"
], function(WebMap, MapView, FeatureLayer, SketchViewModel, GraphicsLayer, OAuthInfo, esriId){
// The ArcGIS loader skips async callbacks, so the async work lives in this wrapper.
(async () => {

  const DRY_RUN = new URLSearchParams(location.search).get("dryrun") === "1";
  // Same OAuth app as index.html; its redirect URL is this site's oauth-callback.html.
  const APP_ID = "iZVrlrTESdLg7Oyj";
  const PORTAL_URL = "https://www.arcgis.com";
  esriId.registerOAuthInfos([ new OAuthInfo({ appId: APP_ID, portalUrl: PORTAL_URL, popup: true }) ]);

  async function signIn(){
    const sharingUrl = PORTAL_URL + "/sharing";
    try {
      return await esriId.checkSignInStatus(sharingUrl);
    } catch {
      const overlay = document.getElementById("signInOverlay");
      overlay.style.display = "flex";
      return new Promise(resolve => {
        document.getElementById("signInBtn").onclick = async () => {
          try {
            const credential = await esriId.getCredential(sharingUrl);
            overlay.style.display = "none";
            resolve(credential);
          } catch {
            document.getElementById("signInText").innerText = "Sign in failed or was cancelled. Please try again.";
          }
        };
      });
    }
  }
  await signIn();

  const $ = id => document.getElementById(id);
  const sidePanel = $("sidePanel"), selList = $("selList"), submitBtn = $("submitBtn"), messageDiv = $("message");
  if(DRY_RUN) $("dryRunBadge").style.display = "block";

  // ---- Form ----
  function makeInput(f){
    let input;
    if(f.type === "select" || f.type === "yesno"){
      input = document.createElement("select");
      const opts = f.type === "yesno" ? CONFIG.yesNo : f.domain;
      input.add(new Option(f.required ? "Choose…" : "No value", ""));
      opts.forEach(o => input.add(new Option(o.label, o.value)));
    } else if(f.type === "textarea"){
      input = document.createElement("textarea");
      input.maxLength = f.maxLength;
    } else if(f.type === "now"){
      input = document.createElement("input");
      input.readOnly = true;
      input.value = "Now (when saved)";
    } else {
      input = document.createElement("input");
      input.type = f.type;
      if(f.maxLength) input.maxLength = f.maxLength;
    }
    input.id = f.id;
    return input;
  }
  function makeField(f){
    const wrap = document.createElement("div");
    wrap.id = "wrap_" + f.id;
    const label = document.createElement("label");
    label.htmlFor = f.id;
    label.innerText = f.label;
    if(f.required){ const s = document.createElement("span"); s.className = "required"; s.innerText = "*"; label.appendChild(s); }
    wrap.append(label, makeInput(f));
    if(f.hint){ const h = document.createElement("div"); h.className = "hint"; h.innerText = f.hint; wrap.appendChild(h); }
    return wrap;
  }
  const form = $("recordForm");
  CONFIG.fields.forEach(f => {
    if(f.pair){
      const p = document.createElement("div"); p.className = "pair";
      f.pair.forEach(x => p.appendChild(makeField(x)));
      form.appendChild(p);
    } else form.appendChild(makeField(f));
  });
  function applyVisibility(){
    flatFields.filter(f => f.visibleIf).forEach(f => { $("wrap_" + f.id).style.display = f.visibleIf() ? "" : "none"; });
  }
  form.addEventListener("change", applyVisibility);
  applyVisibility();

  let deviceTypeTouched = false;
  $("DeviceType").addEventListener("change", () => { deviceTypeTouched = true; });
  $("Rat").addEventListener("change", () => {
    for(const s of selected.values()) s.rat = val("Rat");
    renderList();
  });

  function showMessage(text, type="info", duration=4000){
    messageDiv.innerText = text;
    messageDiv.style.display = "block";
    const c = { success:["rgba(143,174,126,0.16)","#b9d3aa","rgba(143,174,126,0.5)"],
                error:["rgba(224,138,60,0.16)","#f0b27a","rgba(224,138,60,0.5)"],
                info:["rgba(199,180,151,0.14)","#f1e6d0","rgba(199,180,151,0.4)"] }[type];
    [messageDiv.style.background, messageDiv.style.color, messageDiv.style.borderColor] = c;
    clearTimeout(showMessage.t);
    if(duration) showMessage.t = setTimeout(() => { messageDiv.style.display = "none"; }, duration);
  }

  // ---- Map ----
  const webmap = new WebMap({ portalItem: { id: CONFIG.webmapId } });
  const view = new MapView({ container: "viewDiv", map: webmap });
  const recordsTable = new FeatureLayer({ url: CONFIG.recordsUrl });

  // objectId -> { gid, deviceId, type, island, status, rat }
  const selected = new Map();
  let locLayer, layerView, highlightHandle = null;

  function renderList(){
    selList.innerHTML = "";
    const rows = [...selected.entries()].sort((a, b) => (a[1].deviceId || "").localeCompare(b[1].deviceId || "", undefined, { numeric:true }));
    for(const [oid, s] of rows){
      const row = document.createElement("div"); row.className = "row";
      const id = document.createElement("div"); id.className = "id"; id.title = "Zoom to device";
      id.innerText = s.deviceId || "(no Device ID)";
      const meta = document.createElement("span"); meta.className = "meta";
      meta.innerText = [s.type, s.island, s.status].filter(Boolean).join(" · ");
      id.appendChild(meta);
      id.onclick = () => view.goTo({ target: s.geometry, zoom: Math.max(view.zoom, 17) });
      const rat = document.createElement("select"); rat.title = "Rat";
      rat.add(new Option("Rat?", "")); CONFIG.yesNo.forEach(o => rat.add(new Option("Rat: " + o.label, o.value)));
      rat.value = s.rat == null ? "" : String(s.rat);
      rat.classList.toggle("yes", s.rat === 1);
      rat.onchange = () => { s.rat = rat.value === "" ? null : Number(rat.value); rat.classList.toggle("yes", s.rat === 1); };
      const x = document.createElement("button"); x.className = "x"; x.innerText = "×"; x.title = "Remove";
      x.onclick = () => { selected.delete(oid); refreshSelection(); };
      row.append(id, rat, x);
      selList.appendChild(row);
    }
  }

  function refreshSelection(){
    if(highlightHandle) highlightHandle.remove();
    highlightHandle = selected.size && layerView ? layerView.highlight([...selected.keys()]) : null;
    $("count").innerText = selected.size + " selected";
    submitBtn.disabled = selected.size === 0;
    submitBtn.innerText = selected.size ? `Add ${selected.size} record${selected.size === 1 ? "" : "s"}` : "Add records";
    // Like the form's "pull device type from parent": suggest the type when all selected devices share one.
    if(!deviceTypeTouched){
      const types = new Set([...selected.values()].map(s => CONFIG.deviceTypeMap[s.type] || ""));
      $("DeviceType").value = types.size === 1 ? [...types][0] : "";
    }
    renderList();
  }

  const OUT = ["OBJECTID", "GlobalID", "DeviceID", "DeviceType", "IslandName", "devicestatus"];
  function addFeatures(features){
    let added = 0;
    for(const f of features){
      const a = f.attributes;
      if(selected.has(a.OBJECTID) || !a.GlobalID) continue;
      selected.set(a.OBJECTID, { gid:a.GlobalID, deviceId:a.DeviceID, type:a.DeviceType, island:a.IslandName,
        status:a.devicestatus, geometry:f.geometry, rat:val("Rat") });
      added++;
    }
    refreshSelection();
    return added;
  }

  async function addByObjectIds(objectIds){
    const ids = objectIds.filter(id => !selected.has(id));
    const batches = [];
    for(let i = 0; i < ids.length; i += 500) batches.push(ids.slice(i, i + 500));
    const results = await Promise.all(batches.map(objectIds =>
      locLayer.queryFeatures({ objectIds, outFields: OUT, returnGeometry: true })));
    return addFeatures(results.flatMap(r => r.features));
  }

  view.when(async () => {
    locLayer = webmap.allLayers.find(l => l.type === "feature" && [l.url, l.url + "/" + l.layerId].includes(CONFIG.locationsUrl));
    if(!locLayer){ showMessage("Monitoring device locations layer not found in the field map.", "error", 0); return; }
    locLayer.popupEnabled = false;
    view.popup.autoOpenEnabled = false;
    locLayer.definitionExpression = CONFIG.statusFilter;
    layerView = await view.whenLayerView(locLayer);
    sidePanel.style.display = "flex";

    // ---- Toolbar ----
    const lassoLayer = new GraphicsLayer({ listMode: "hide" });
    view.map.add(lassoLayer);
    const lassoSymbol = { type:"simple-fill", color:[0,121,193,0.12], outline:{ color:[0,121,193], width:2, style:"dash" } };
    const sketchVM = new SketchViewModel({ view, layer: lassoLayer, defaultCreateOptions:{ mode:"freehand" },
      polygonSymbol: lassoSymbol, activeFillSymbol: lassoSymbol });

    const toolbar = document.createElement("div"); toolbar.id = "toolbar";
    const lassoBtn = document.createElement("button"); lassoBtn.className = "btn"; lassoBtn.innerText = "Lasso select";
    const clearBtn = document.createElement("button"); clearBtn.className = "btn secondary"; clearBtn.innerText = "Clear selection";
    const islandSel = document.createElement("select"); islandSel.title = "Show devices on";
    islandSel.add(new Option("All islands", ""));
    const hint = document.createElement("div"); hint.id = "toolbarHint";
    const lassoHint = "Drag around devices to select. Esc to cancel.";
    toolbar.append(lassoBtn, clearBtn, islandSel, hint);
    view.ui.add(toolbar, "top-left");

    const stats = await locLayer.queryFeatures({ where: CONFIG.statusFilter, groupByFieldsForStatistics: ["IslandName"],
      outStatistics: [{ statisticType:"count", onStatisticField:"OBJECTID", outStatisticFieldName:"n" }] });
    stats.features.map(f => f.attributes).filter(a => a.IslandName).sort((a, b) => a.IslandName.localeCompare(b.IslandName))
      .forEach(a => islandSel.add(new Option(`${a.IslandName} (${a.n})`, a.IslandName)));
    islandSel.onchange = async () => {
      const island = islandSel.value;
      locLayer.definitionExpression = CONFIG.statusFilter + (island ? ` AND IslandName = '${island.replace(/'/g, "''")}'` : "");
      if(island){
        const ext = await locLayer.queryExtent({ where: locLayer.definitionExpression });
        if(ext.extent) view.goTo(ext.extent.expand(1.3));
      }
    };

    let hintTimer = null, lassoFinishedAt = 0;
    function setLassoActive(active){
      clearTimeout(hintTimer);
      lassoBtn.classList.toggle("active", active);
      lassoBtn.innerText = active ? "Cancel lasso" : "Lasso select";
      hint.innerText = lassoHint;
      hint.style.display = active ? "block" : "none";
      view.container.style.cursor = active ? "crosshair" : "";
    }
    function flashHint(text){
      clearTimeout(hintTimer);
      hint.innerText = text; hint.style.display = "block";
      hintTimer = setTimeout(() => { hint.style.display = "none"; }, 3000);
    }

    lassoBtn.onclick = () => {
      if(sketchVM.state === "active"){ sketchVM.cancel(); return; }
      sketchVM.create("polygon");
      setLassoActive(true);
    };
    clearBtn.onclick = () => {
      if(sketchVM.state === "active") sketchVM.cancel();
      selected.clear();
      refreshSelection();
    };

    sketchVM.on("create", async event => {
      if(event.state === "cancel"){ setLassoActive(false); lassoLayer.removeAll(); return; }
      if(event.state !== "complete") return;
      setLassoActive(false);
      lassoFinishedAt = Date.now();
      const geometry = event.graphic.geometry;
      lassoLayer.removeAll();
      try{
        const objectIds = await layerView.queryObjectIds({ geometry, spatialRelationship: "intersects" });
        if(!objectIds.length){ flashHint("No devices inside the lasso."); return; }
        await addByObjectIds(objectIds);
      } catch(err){
        console.error("Lasso selection failed", err);
        flashHint("Lasso selection failed: " + err.message);
      }
    });

    // Click a device to add it; click a selected device again to remove it.
    view.on("click", async event => {
      if(sketchVM.state === "active" || Date.now() - lassoFinishedAt < 400) return;
      const hit = await view.hitTest(event, { include: [locLayer] });
      const graphic = hit.results[0]?.graphic;
      if(!graphic) return;
      const oid = graphic.attributes[locLayer.objectIdField];
      try{
        if(selected.has(oid)){ selected.delete(oid); refreshSelection(); }
        else await addByObjectIds([oid]);
      } catch(err){
        console.error("Selection failed", err);
        flashHint("Selection failed: " + err.message);
      }
    });

    // Type or paste Device IDs (comma, space or new line separated).
    async function findByIds(){
      const ids = [...new Set($("findInput").value.split(/[\s,;]+/).map(s => s.trim()).filter(Boolean))];
      if(!ids.length) return;
      const where = CONFIG.statusFilter + " AND DeviceID IN (" + ids.map(s => `'${s.replace(/'/g, "''")}'`).join(",") + ")";
      try{
        const { features } = await locLayer.queryFeatures({ where, outFields: OUT, returnGeometry: true });
        addFeatures(features);
        const found = new Set(features.map(f => f.attributes.DeviceID));
        const missing = ids.filter(s => !found.has(s));
        if(missing.length) showMessage("Not found (or not Deployed/Broken/Missing/Planned): " + missing.join(", "), "error", 8000);
        else $("findInput").value = "";
      } catch(err){
        showMessage("Search failed: " + err.message, "error");
      }
    }
    $("findBtn").onclick = findByIds;
    $("findInput").addEventListener("keydown", e => { if(e.key === "Enter") findByIds(); });
  });

  // ---- Save ----
  function toEpoch(v){ return v ? new Date(v).getTime() : null; } // datetime-local is read as local (NZ) time

  submitBtn.onclick = async () => {
    if(!selected.size){ showMessage("Select at least one device", "error"); return; }
    const missing = flatFields.filter(f => f.required && !f.perRow && val(f.id) == null).map(f => f.label);
    const noRat = [...selected.values()].filter(s => s.rat == null);
    if(noRat.length) missing.push(`Rat for ${noRat.length} device${noRat.length === 1 ? "" : "s"}`);
    if(missing.length){ showMessage("Complete: " + missing.join(", "), "error", 6000); return; }
    if(toEpoch(val("DateRetrieved")) < toEpoch(val("DateDeployed"))){
      showMessage("Date Retrieved is before Date Deployed", "error"); return;
    }

    const shared = { DateChecked: Date.now() };
    for(const f of flatFields){
      if(f.type === "now" || f.perRow) continue;
      if(f.visibleIf && !f.visibleIf()){ shared[f.id] = null; continue; }
      const v = val(f.id);
      shared[f.id] = f.type === "datetime-local" ? toEpoch(v) : (typeof v === "string" ? v.trim() || null : v);
    }
    const entries = [...selected.entries()];
    const adds = entries.map(([, s]) => ({ attributes: {
      ...shared,
      Rat: s.rat,
      GUID_MonitoringRecords: s.gid,  // relationship key: location GlobalID
      DeviceID_records: s.deviceId ?? null
    }}));

    if(DRY_RUN){
      console.table(adds.map(a => a.attributes));
      showMessage(`Test mode: ${adds.length} record${adds.length === 1 ? "" : "s"} built, nothing saved (see the browser console).`, "info", 6000);
      window.lastDryRun = adds;
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "Saving…";
    const failed = [];
    try{
      for(let i = 0; i < adds.length; i += 200){
        const result = await recordsTable.applyEdits({ addFeatures: adds.slice(i, i + 200) });
        result.addFeatureResults.forEach((r, j) => { if(r.error) failed.push({ oid: entries[i + j][0], error: r.error }); });
      }
    } catch(err){
      showMessage("Error adding records: " + err.message + "\nNothing after the error was saved; check the records before retrying.", "error", 0);
      refreshSelection();
      return;
    }

    const ok = adds.length - failed.length;
    // Keep only the failed devices selected so they can be retried.
    const failedIds = new Set(failed.map(f => f.oid));
    for(const oid of [...selected.keys()]) if(!failedIds.has(oid)) selected.delete(oid);
    if(failed.length){
      console.error("Failed records", failed);
      showMessage(`Added ${ok}. ${failed.length} failed (still selected): ${failed[0].error.message}`, "error", 0);
    } else {
      showMessage(`Added ${ok} record${ok === 1 ? "" : "s"}.`, "success");
      // Keep device type and dates for the next batch; clear the per-check answers.
      ["Rat", "Bird", "Insect", "Other", "OtherSpecifiy", "Comments_records"].forEach(id => { $(id).value = ""; });
      applyVisibility();
    }
    refreshSelection();
  };

})();
});
</script>
